<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPI Game - Ragam Aktivitas Manusia (IPS VIII, Bab 2)</title>
<meta name="description" content="Media pembelajaran interaktif berbasis game: Ragam Aktivitas Manusia, IPS Kelas VIII Bab 2, SMP Negeri 1 Manado.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050d1a;--bg2:#08213a;--panel:rgba(9,29,49,.86);--panel2:rgba(14,42,66,.9);--line:#1b4a66;--line2:#2b6d8d;
  --cyan:#22e4ff;--cyan-d:#0aa9c4;--green:#25c47f;--green-d:#0e7a4d;--green-panel:#136f4b;
  --orange:#ff9f2e;--coral:#ff5d73;--gold:#ffd166;--violet:#9a86ff;
  --text:#e9f7ff;--muted:#93b5c9;--ink:#04202b;
  --fd:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --fb:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 700px at 78% -10%,#0f3a5c 0%,transparent 60%),
  radial-gradient(900px 600px at 5% 105%,#0b3a44 0%,transparent 55%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(34,228,255,.28) 1px,transparent 1.2px);background-size:34px 34px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;margin:0 0 .4em;font-weight:700}
p{margin:.5em 0}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
svg{display:block}

/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:50;padding:10px clamp(10px,3vw,36px) 0}
.hud{display:flex;align-items:center;gap:14px;background:rgba(6,20,36,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;padding:8px 12px;box-shadow:0 0 0 1px rgba(34,228,255,.06) inset,0 10px 30px #0006}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:19px;white-space:nowrap;background:none;border:0;padding:2px 6px 2px 2px}
.logo svg{width:38px;height:38px;filter:drop-shadow(0 0 8px rgba(34,228,255,.55))}
.logo small{display:block;font-family:var(--fb);font-weight:600;font-size:11.5px;color:var(--muted);line-height:1}
.nav{display:flex;gap:4px;margin-left:8px;flex:1}
.nav button{white-space:nowrap;display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;color:var(--muted);font-weight:700;padding:8px 14px;border-radius:12px;transition:.15s}
.nav button svg{width:20px;height:20px}
.nav button:hover{color:var(--text);background:rgba(34,228,255,.07)}
.nav button[aria-current=page]{color:var(--cyan);background:rgba(34,228,255,.1);border-color:rgba(34,228,255,.25)}
.hudr{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:14.5px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip.fire{color:var(--orange)}.chip.xp{color:var(--cyan)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);padding:0}
.iconbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed=false]{color:var(--muted);opacity:.7}
.avatar{width:42px;height:42px;flex:none}
.userbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0 4px;color:var(--text);font-weight:700}
.userbtn span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}

#app{padding:18px clamp(10px,3vw,36px) 50px;max-width:1440px;margin:0 auto}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 30px}

/* ---------- Buttons & panels ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:16px;
  background:linear-gradient(180deg,#39eeff,#0fbfe0);color:var(--ink);box-shadow:0 4px 0 #087a91,0 10px 24px rgba(34,228,255,.25);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #087a91}
.btn svg{width:20px;height:20px}
.btn.green{background:linear-gradient(180deg,#3ee59b,#19b56f);box-shadow:0 4px 0 #0c7148,0 10px 24px rgba(37,196,127,.25)}
.btn.orange{background:linear-gradient(180deg,#ffbe5a,#f08a12);box-shadow:0 4px 0 #a55a05,0 10px 24px rgba(255,159,46,.25)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:none;border:1px solid var(--line2)}
.btn.ghost:active{transform:none}
.btn.danger{background:linear-gradient(180deg,#ff7b8d,#e0405a);box-shadow:0 4px 0 #8f1f34;color:#fff}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn:disabled,.btn[aria-disabled=true]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;box-shadow:none;transform:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(34,228,255,.04) inset,0 16px 40px #0005}
.panel.glow{border-color:rgba(34,228,255,.45);box-shadow:0 0 0 1px rgba(34,228,255,.12) inset,0 0 36px rgba(34,228,255,.14),0 16px 40px #0005}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:rgba(34,228,255,.12);color:var(--cyan);font-weight:800;font-size:13px}
.pill svg{width:15px;height:15px;flex:none}
.pill.ok{background:rgba(37,196,127,.16);color:#5ff0b0}.pill.warn{background:rgba(255,159,46,.16);color:var(--orange)}.pill.bad{background:rgba(255,93,115,.16);color:#ff8c9b}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:#0d2a40;overflow:hidden;border:1px solid #17405a}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1ed0f0,#25c47f);transition:width .5s}

/* ---------- Welcome ---------- */
.welcome{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:20px}
.wgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;max-width:1100px;width:100%}
.globe{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin:auto}
.globe svg{width:100%;height:100%}
.wtitle{font-size:clamp(30px,3.8vw,50px);font-weight:800;margin-bottom:8px}
.wtitle span{color:var(--cyan);text-shadow:0 0 28px rgba(34,228,255,.5)}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-weight:800;font-size:14px;color:var(--muted)}
input[type=text],select,textarea,input[type=number],input[type=password]{width:100%;background:#061829;border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,228,255,.18)}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{background:none;border:2px solid transparent;border-radius:16px;padding:3px}
.avpick button[aria-checked=true]{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,228,255,.4)}
.avpick button>svg{width:50px;height:50px}
.plist{display:grid;gap:8px;margin-top:10px}
.plist button{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--text)}
.plist button:hover{border-color:var(--cyan)}

/* ---------- Home ---------- */
.home-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 20px}
.home-h h1{font-size:clamp(30px,4.4vw,52px);font-weight:800}
.home-h h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 24px rgba(34,228,255,.4)}
.quote{max-width:380px;padding:14px 18px;display:flex;gap:12px;font-size:15px}
.quote svg{width:26px;height:26px;color:var(--cyan);flex:none}
.quote small{display:block;color:var(--muted);margin-top:4px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card-h{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:18px;margin-bottom:8px}
.card-h svg{width:24px;height:24px;color:var(--cyan)}
.ring{position:relative;width:min(230px,100%);aspect-ratio:1;margin:6px auto}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid small{color:var(--muted);font-weight:700;font-size:16px}
.ring .mid b{font-family:var(--fd);font-size:76px;line-height:.9;font-weight:800}
.ring .mid span{color:var(--cyan);font-size:22px}
.xpline{text-align:center;font-weight:800;font-size:19px}.xpline b{color:var(--cyan)}
.streakbig{font-family:var(--fd);font-size:32px;font-weight:800}
.streakbig span{color:var(--cyan)}
.heat{display:grid;grid-template-columns:auto repeat(12,1fr);gap:4px;font-size:12px;color:var(--muted);align-items:center;margin-top:10px}
.heat i{display:block;aspect-ratio:1;border-radius:5px;background:#0b2337;border:1px solid #123551}
.heat i[data-l="1"]{background:#0f4a63}.heat i[data-l="2"]{background:#0c7f9b}.heat i[data-l="3"]{background:#19bcd8}.heat i[data-l="4"]{background:#5df3ff;box-shadow:0 0 8px rgba(93,243,255,.6)}
.heat .fut{opacity:.25}
.legend{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.nextcard{display:flex;flex-direction:column;height:100%}
.nextcard .pic{border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#0a2a46,#061829);border:1px solid var(--line);margin-bottom:12px}
.nextcard h3{font-size:26px}
.nextcard .btn{margin-top:auto}
.skills{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:22px}
.hexrow{display:flex;gap:14px;flex-wrap:wrap}
.hex{width:74px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.hex .h{width:74px;height:82px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:linear-gradient(160deg,#1a4d6a,#0a2a40);position:relative}
.hex .h::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(160deg,#0d3550,#071c2e)}
.hex .h svg{position:relative;width:34px;height:34px;color:#4b7a93}
.hex.on .h{background:linear-gradient(160deg,#5df3ff,#25c47f)}
.hex.on .h::before{background:linear-gradient(160deg,#0f5f66,#0a3b3f)}
.hex.on .h svg{color:#d9fffb;filter:drop-shadow(0 0 6px rgba(93,243,255,.8))}
.hex.on{color:var(--text)}
.hex span{display:block;margin-top:5px;line-height:1.15}
.tagline{display:flex;gap:10px;justify-content:center;align-items:center;color:var(--muted);margin-top:26px;font-size:15px}
.tagline svg{width:22px;height:22px;color:var(--cyan)}

/* ---------- Map ---------- */
.maptop{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.maptop h1{font-size:clamp(24px,3vw,34px);margin:0}
.progtop{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:14px;font-weight:800;min-width:240px}
.progtop .bar{flex:1;height:9px}
.mapwrap{max-width:calc((100vh - 210px)*5/3);min-width:min(100%,760px);margin:0 auto;position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line2);background:radial-gradient(circle at 50% 40%,#123f66 0%,#0a2540 45%,#061527 100%);box-shadow:0 0 60px rgba(34,228,255,.1),0 20px 60px #0007;aspect-ratio:5/3}
.scene>svg,.hubscene>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(46px,5.6%,70px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:none;z-index:3}
.node .c{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#fff;border:clamp(4px,.5vw,7px) solid var(--orange);box-shadow:0 6px 18px #0008,0 0 0 clamp(3px,.4vw,6px) rgba(255,255,255,.55);transition:transform .15s}
.node:hover .c{transform:scale(1.1)}
.node svg{width:56%;height:56%}
.node.done .c{border-color:var(--green-d);background:#fff}
.node.open .c{animation:pulse 1.8s infinite}
.node.locked .c{background:rgba(180,190,200,.55);border-color:rgba(255,255,255,.35);box-shadow:none}
.node.sel .c{box-shadow:0 6px 18px #0008,0 0 0 clamp(4px,.55vw,8px) var(--cyan),0 0 26px var(--cyan)}
.node .lbl{position:absolute;top:112%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(6,20,36,.85);color:#fff;font-weight:800;font-size:clamp(11px,1.15vw,15px);padding:2px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18)}
.node .stars{position:absolute;top:-24%;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .stars svg{width:clamp(12px,1.4vw,18px);height:auto}
@keyframes pulse{0%{box-shadow:0 6px 18px #0008,0 0 0 4px rgba(255,255,255,.55),0 0 0 4px rgba(255,159,46,.7)}70%{box-shadow:0 6px 18px #0008,0 0 0 4px rgba(255,255,255,.55),0 0 0 18px rgba(255,159,46,0)}100%{box-shadow:0 6px 18px #0008,0 0 0 4px rgba(255,255,255,.55),0 0 0 4px rgba(255,159,46,0)}}
.isl{animation:bob 7s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flow{stroke-dasharray:10 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.missioncard{position:absolute;top:2.4%;right:1.6%;width:min(25%,300px);background:linear-gradient(180deg,rgba(19,111,75,.96),rgba(11,74,52,.96));border:1px solid #3ed99a;border-radius:8px;box-shadow:0 12px 30px #0008,0 0 0 1px rgba(255,255,255,.08) inset;z-index:4;overflow:hidden}
.missioncard .pic{display:none;aspect-ratio:16/8;background:#062035;border-bottom:1px solid rgba(255,255,255,.15)}
.missioncard .pic svg{width:100%;height:100%}
.missioncard .b{padding:10px 14px 12px}
.missioncard h3{font-size:clamp(16px,1.7vw,21px);margin:0 0 4px}
.missioncard .sk{font-size:12px;color:#bff5dc;margin-bottom:4px}
.missioncard .hexrow{gap:8px}
.missioncard .hex{width:56px}.missioncard .hex .h{width:52px;height:58px}.missioncard .hex .h svg{width:24px;height:24px}
.missioncard .go{margin-top:8px;width:100%}
.mini .hex{width:44px}.mini .hex .h{width:44px;height:49px}.mini .hex .h svg{width:20px;height:20px}.mini.row{gap:8px;flex-wrap:nowrap}.missioncard .sk{font-size:12.5px;color:#bff5dc;margin:2px 0 6px}.small{font-size:13px}
.dialog{position:absolute;left:1.6%;bottom:3%;width:min(36%,430px);display:flex;gap:0;background:linear-gradient(180deg,rgba(19,111,75,.96),rgba(11,74,52,.96));border:1px solid #3ed99a;border-radius:8px;z-index:4;box-shadow:0 12px 30px #0008;min-height:120px}
.dialog .pt{width:26%;flex:none;position:relative;background:rgba(0,0,0,.18);border-right:1px solid rgba(255,255,255,.12);overflow:hidden}
.dialog .pt svg{position:absolute;bottom:0;left:0;width:100%;height:auto}
.dialog .tx{padding:8px 14px 10px;font-size:clamp(12px,1.05vw,14px)}
.dialog .tx small{color:#bff5dc;font-weight:700}
.dialog .tx b{display:block;font-family:var(--fd);font-size:clamp(15px,1.5vw,19px);margin:0 0 2px}
.dialog .tx p{margin:2px 0;color:#eafff4;line-height:1.4}
.mapfoot{display:none}

/* ---------- Mission hub ---------- */
.hubbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hubbar .back{width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.hubbar .back:hover{border-color:var(--cyan);color:var(--cyan)}
.hubbar h1{font-size:clamp(22px,3vw,34px);margin:0;flex:1}
.hubgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
.hubscene{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line2);background:radial-gradient(circle at 50% 40%,#123f66 0%,#0a2540 50%,#061527 100%);aspect-ratio:4/3;box-shadow:0 0 50px rgba(34,228,255,.1)}
.hubscene>svg{position:absolute;inset:0;width:100%;height:100%}
.hubscene .node{width:clamp(56px,10%,84px)}
.hubscene .node .lbl{font-size:clamp(12px,1.5vw,17px)}
.hubinfo h3{font-size:22px}
.topics{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.topics li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(34,228,255,.06);border:1px solid rgba(34,228,255,.16)}
.topics li svg{width:20px;height:20px;color:var(--cyan);flex:none;margin-top:2px}
.reqs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}

/* ---------- Learn ---------- */
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.lhead .back{width:44px;height:44px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;padding:0}
.lhead h2{font-size:clamp(18px,2.4vw,26px);margin:0;flex:1}
.segs{display:flex;gap:6px;margin-bottom:16px}
.segs button{flex:1;height:10px;border-radius:99px;background:#0d2a40;border:1px solid #17405a;padding:0}
.segs button.seen{background:linear-gradient(90deg,#1ed0f0,#25c47f);border-color:transparent}
.segs button.cur{outline:2px solid var(--cyan);outline-offset:2px}
.lcard{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:24px;align-items:start}
.lvis{position:sticky;top:96px}
.visbox{border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(180deg,#0b2c4a,#071a2e);box-shadow:0 0 30px rgba(34,228,255,.08)}
.visbox svg{width:100%;height:auto}
.vcap{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
.ltxt h3{font-size:clamp(24px,3vw,34px)}
.ltxt h4{font-size:19px;color:var(--cyan);margin:16px 0 4px}
.ltxt p,.ltxt li{font-size:17px}
.ltxt ul,.ltxt ol{padding-left:22px;margin:6px 0}
.ltxt li{margin:4px 0}
.ltxt .tbl{overflow-x:auto;margin:10px 0}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th{background:#0d3350;color:var(--cyan);text-align:left;font-family:var(--fd);font-size:15px}
table.t th,table.t td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.fact{display:flex;gap:12px;padding:12px 14px;margin:14px 0;border-radius:14px;background:linear-gradient(90deg,rgba(255,159,46,.14),rgba(255,159,46,.04));border:1px solid rgba(255,159,46,.4)}
.fact svg{width:24px;height:24px;color:var(--orange);flex:none}
.fact b{color:var(--orange)}
.terms{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

/* quick check */
.quick{margin-top:20px;border:1.5px solid var(--green);border-radius:18px;background:linear-gradient(180deg,rgba(37,196,127,.1),rgba(37,196,127,.03));padding:16px}

/* calc */
.calc{margin-top:16px}
.calc .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

/* video */

.links a:hover{border-color:var(--cyan)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line2);padding-left:10px;margin:10px 0}

/* ---------- Practice ---------- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin:16px 0}
.pcol{display:grid;gap:12px;align-content:start}
.pcard{text-align:left;padding:14px 16px;border-radius:14px;background:#0b2f4a;border:2px solid var(--line2);font-weight:700;font-size:16.5px;color:var(--text);min-height:64px;transition:.12s}
.pcard.term{font-family:var(--fd);font-size:20px;background:linear-gradient(180deg,#0e3c60,#0a2c48)}
.pcard:hover:not(:disabled){border-color:var(--cyan)}
.pcard.sel{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,228,255,.25),0 0 22px rgba(34,228,255,.35);transform:scale(1.02)}

@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- Quiz ---------- */
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.qtop .prog{flex:1;min-width:200px}
.qtop .prog .bar{height:14px}
.qstat{display:flex;gap:8px}
.combo{font-family:var(--fd);font-weight:800;color:var(--orange);opacity:0;transform:scale(.6);transition:.2s}
.combo.on{opacity:1;transform:scale(1)}
.qbox{max-width:900px;margin:0 auto;padding:24px clamp(16px,3vw,32px)}
.qtype{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-weight:700;font-size:14px}
.qstem{font-size:clamp(18px,2.2vw,23px);font-weight:700;line-height:1.45;margin:0 0 18px}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:#0b2f4a;border:2px solid var(--line2);border-radius:14px;padding:13px 16px;font-size:17px;font-weight:600;color:var(--text);transition:.12s;width:100%}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#08243b;border:1.5px solid var(--line2);font-family:var(--fd);font-weight:800;color:var(--cyan)}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(4px)}
.opt.sel{border-color:var(--cyan);background:#0d3b5e;box-shadow:0 0 0 3px rgba(34,228,255,.2)}
.opt.ok{border-color:var(--green);background:rgba(37,196,127,.22)}
.opt.ok .k{background:var(--green);color:#03281a;border-color:var(--green)}
.opt.no{border-color:var(--coral);background:rgba(255,93,115,.18)}
.opt.no .k{background:var(--coral);color:#3a0510;border-color:var(--coral)}
.opt:disabled{cursor:default}
.tfgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfgrid .opt{justify-content:center;font-family:var(--fd);font-size:24px;font-weight:700;padding:20px}
.termbig{font-family:var(--fd);font-size:clamp(28px,4vw,42px);font-weight:800;text-align:center;color:var(--cyan);margin:6px 0 16px;text-shadow:0 0 24px rgba(34,228,255,.35)}
textarea.ans{min-height:130px;font-size:17px;resize:vertical}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1.5px solid;animation:pop .25s}

.fb.ok{background:rgba(37,196,127,.14);border-color:var(--green)}
.fb.no{background:rgba(255,93,115,.12);border-color:var(--coral)}
.fb.mid{background:rgba(255,159,46,.12);border-color:var(--orange)}
.fb h4{margin:0 0 4px;font-size:20px}
.fb.ok h4{color:#5ff0b0}.fb.no h4{color:#ff8c9b}.fb.mid h4{color:var(--orange)}
.fb p{margin:4px 0;font-size:16px}
.kwchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.kwchips span{padding:2px 10px;border-radius:99px;font-size:13.5px;font-weight:700;background:rgba(37,196,127,.2);color:#8ff5c8}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.qdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:100%;margin:14px auto 0}
.qdots button{width:22px;height:22px;border-radius:7px;background:#0d2a40;border:1px solid #17405a;padding:0;font-size:10px;color:var(--muted);font-weight:800}
.qdots button.ans{background:#0f4a63;color:#fff}
.qdots button.ok{background:var(--green-d);border-color:var(--green)}
.qdots button.no{background:#8f1f34;border-color:var(--coral)}
.qdots button.cur{outline:2px solid var(--cyan);outline-offset:1px}

/* ---------- Result ---------- */
.result{max-width:820px;margin:20px auto;text-align:center;padding:30px clamp(16px,4vw,40px)}

}

const BANK={"modules": [{"title": "Adaptasi Manusia terhadap Dampak Perubahan Iklim", "pages": "88–101", "desc": "Menganalisis risiko perubahan iklim dan memilih tindakan adaptasi yang sesuai dengan kondisi lingkungan.", "topics": ["Risiko banjir, cuaca ekstrem, dan perubahan musim", "Informasi cuaca dan kesiapsiagaan", "Mangrove, ruang hijau, daerah resapan, dan diversifikasi mata pencaharian", "Kerja sama pemerintah, masyarakat, dan lembaga lainnya"]}, {"title": "Aktivitas Manusia pada Lembaga Keuangan", "pages": "102–114", "desc": "Memahami peran lembaga keuangan dan mengambil keputusan keuangan secara bertanggung jawab.", "topics": ["Peran lembaga keuangan dalam produksi, distribusi, dan konsumsi", "Bank Indonesia, bank umum, dan BPR", "Tabungan, pinjaman, anggaran, dan kemampuan membayar", "Keamanan layanan keuangan digital dan risiko kredit macet"]}, {"title": "Aktivitas Manusia Menyesuaikan dengan Nilai dan Norma Sosial", "pages": "115–125", "desc": "Menganalisis hubungan nilai, norma, keteraturan, toleransi, dan penyelesaian masalah sosial.", "topics": ["Nilai sosial dan norma sosial", "Norma dalam keluarga, sekolah, dan masyarakat", "Kejujuran, tanggung jawab, toleransi, dan musyawarah", "Penerapan norma untuk menjaga lingkungan dan kehidupan bersama"]}, {"title": "Aktivitas Manusia Menelusuri Sejarah Wilayah melalui Toponimi", "pages": "126 dan seterusnya", "desc": "Menelusuri asal-usul nama wilayah melalui sumber lisan, tertulis, lingkungan, dan sejarah masyarakat.", "topics": ["Pengertian dan fungsi toponimi", "Nama tempat dan kondisi geografis", "Sumber lisan, arsip, peta lama, dan buku sejarah", "Verifikasi informasi dan penghargaan terhadap masyarakat lokal"]}], "mc": [{"id": "mc01", "n": 1, "mod": 0, "stem": "Sebuah desa pesisir mengalami banjir rob yang semakin sering. Sebagian warga hanya meninggikan lantai rumah, sedangkan warga lainnya menanam mangrove dan mengatur kembali kawasan permukiman. Berdasarkan kasus tersebut, tindakan yang paling menunjukkan strategi adaptasi yang mempertimbangkan kondisi lingkungan adalah ....", "options": ["Memindahkan seluruh kegiatan ekonomi ke wilayah perkotaan", "Menanam mangrove dan menyesuaikan tata ruang permukiman", "Membangun rumah lebih tinggi tanpa mengubah lingkungan sekitar", "Menghentikan seluruh kegiatan masyarakat di wilayah pesisir"], "answer": 1, "why": "Adaptasi yang baik mempertimbangkan kondisi lingkungan. Mangrove meredam gelombang dan penataan ruang mengurangi paparan permukiman terhadap rob, sedangkan meninggikan rumah saja tidak mengatasi sumber masalahnya."}, {"id": "mc02", "n": 2, "mod": 0, "stem": "Hujan deras menyebabkan banjir di sebuah kota. Hasil pengamatan menunjukkan bahwa banyak saluran air tersumbat sampah dan daerah resapan semakin berkurang. Langkah yang paling tepat untuk mengurangi risiko banjir berdasarkan hasil pengamatan tersebut adalah ....", "options": ["Membuat tanggul tinggi di seluruh kawasan permukiman", "Memindahkan warga tanpa memperbaiki penyebab banjir", "Menambah penggunaan kendaraan agar sampah segera diangkut", "Membersihkan saluran air dan memperluas daerah resapan"], "answer": 3, "why": "Hasil pengamatan menunjukkan penyebabnya: saluran tersumbat dan daerah resapan berkurang. Langkah paling tepat adalah mengatasi penyebab itu, yaitu membersihkan saluran dan memperluas daerah resapan."}, {"id": "mc03", "n": 3, "mod": 0, "stem": "Petani di suatu daerah mengalami perubahan pola musim. Musim hujan datang lebih lambat sehingga waktu tanam yang biasanya digunakan menjadi kurang sesuai. Respons yang paling tepat dilakukan petani adalah ....", "options": ["Menyesuaikan waktu tanam berdasarkan informasi cuaca", "Menggunakan pola tanam lama tanpa mempertimbangkan perubahan", "Menghentikan seluruh kegiatan pertanian selama satu tahun", "Menanam tanaman yang sama tanpa memperhatikan kebutuhan air"], "answer": 0, "why": "Musim bergeser sehingga waktu tanam lama tidak cocok lagi. Petani perlu menyesuaikan waktu tanam berdasarkan informasi cuaca dan prakiraan musim."}, {"id": "mc04", "n": 4, "mod": 0, "stem": "Sebuah sekolah berada di wilayah yang sering mengalami cuaca panas ekstrem. Pihak sekolah berencana memasang pendingin ruangan di semua kelas, tetapi anggaran yang tersedia terbatas. Pilihan tindakan yang paling mempertimbangkan keberlanjutan lingkungan adalah ....", "options": ["Menutup semua jendela agar udara panas tidak masuk", "Mengurangi waktu belajar tanpa memperbaiki kondisi ruang", "Menanam pohon peneduh dan memperbaiki sirkulasi udara", "Menggunakan pendingin ruangan sepanjang hari tanpa batas"], "answer": 2, "why": "Anggaran terbatas dan panas ekstrem: pohon peneduh dan sirkulasi udara yang baik murah, tahan lama, dan ramah lingkungan. Pendingin ruangan sepanjang hari boros energi."}, {"id": "mc05", "n": 5, "mod": 0, "stem": "Masyarakat pesisir mengalami penurunan hasil tangkapan ikan akibat perubahan kondisi laut. Sebagian warga kemudian mengembangkan usaha pengolahan hasil laut dan pelatihan keterampilan baru. Kesimpulan yang paling tepat dari tindakan tersebut adalah ....", "options": ["Masyarakat menghindari seluruh kegiatan ekonomi berbasis laut", "Masyarakat melakukan diversifikasi mata pencaharian untuk beradaptasi", "Masyarakat mengganti seluruh pekerjaan dengan kegiatan perdagangan", "Masyarakat menganggap perubahan iklim tidak berpengaruh terhadap ekonomi"], "answer": 1, "why": "Mengembangkan usaha olahan hasil laut dan keterampilan baru berarti menambah sumber penghasilan. Itulah diversifikasi mata pencaharian."}, {"id": "mc06", "n": 6, "mod": 1, "stem": "Rina memiliki sejumlah uang yang ingin disimpan dengan aman. Ia juga ingin dapat mengambil uang tersebut ketika membutuhkan dan memperoleh informasi tentang transaksi yang dilakukan. Layanan lembaga keuangan yang paling sesuai dengan kebutuhan Rina adalah ....", "options": ["Menggunakan jasa bank untuk menyimpan dan mengelola uang", "Menyimpan seluruh uang dalam bentuk barang kebutuhan rumah tangga", "Meminjam uang dari teman tanpa mencatat jumlah dan waktu pengembalian", "Menyimpan uang di rumah tanpa mempertimbangkan risiko kehilangan"], "answer": 0, "why": "Bank menyediakan tempat menyimpan uang yang aman, layanan penarikan, dan catatan transaksi. Ketiganya sesuai kebutuhan Rina."}, {"id": "mc07", "n": 7, "mod": 1, "stem": "Seorang pedagang membutuhkan tambahan modal untuk membeli bahan dagangan. Ia mempertimbangkan pinjaman dari lembaga keuangan dan harus menghitung kemampuan mengembalikannya. Tindakan yang menunjukkan keputusan keuangan bertanggung jawab adalah ....", "options": ["Meminjam sebanyak mungkin tanpa menghitung pendapatan", "Memilih pinjaman berdasarkan ajakan orang yang tidak dikenal", "Membandingkan ketentuan pinjaman dan menghitung kemampuan membayar", "Menggunakan seluruh pendapatan untuk membayar cicilan pinjaman"], "answer": 2, "why": "Keputusan yang bertanggung jawab: membandingkan bunga, jangka waktu, dan ketentuan pinjaman, lalu memastikan penghasilan cukup untuk membayar cicilan."}, {"id": "mc08", "n": 8, "mod": 1, "stem": "Sebuah koperasi sekolah menyediakan layanan simpan pinjam bagi anggotanya. Pengelolaan koperasi dilakukan berdasarkan aturan yang disepakati bersama. Hal yang dapat disimpulkan dari kegiatan tersebut adalah ....", "options": ["Koperasi hanya berfungsi sebagai tempat menyimpan barang siswa", "Koperasi dapat membantu memenuhi kebutuhan ekonomi anggotanya", "Koperasi tidak membutuhkan aturan dalam mengelola dana anggota", "Koperasi hanya dapat digunakan oleh masyarakat yang memiliki usaha besar"], "answer": 1, "why": "Koperasi simpan pinjam membantu anggota memenuhi kebutuhan ekonomi dan dikelola berdasarkan aturan yang disepakati bersama."}, {"id": "mc09", "n": 9, "mod": 1, "stem": "Dua siswa memiliki cara berbeda dalam menggunakan uang saku. Siswa pertama menghabiskan seluruh uangnya untuk membeli barang yang sedang populer. Siswa kedua menyisihkan sebagian uang untuk kebutuhan sekolah. Perilaku siswa kedua menunjukkan ....", "options": ["Penggunaan uang berdasarkan kebutuhan dan perencanaan", "Penolakan terhadap semua bentuk kegiatan konsumsi", "Ketergantungan terhadap lembaga keuangan dalam setiap aktivitas", "Keinginan untuk menghindari seluruh bentuk interaksi ekonomi"], "answer": 0, "why": "Menyisihkan uang untuk kebutuhan sekolah menunjukkan penggunaan uang berdasarkan kebutuhan dan perencanaan, bukan ikut-ikutan tren."}, {"id": "mc10", "n": 10, "mod": 1, "stem": "Sebuah keluarga menerima pesan yang mengatasnamakan bank dan meminta kode rahasia rekening. Pesan tersebut menyatakan bahwa rekening akan diblokir jika kode tidak segera diberikan. Tindakan yang paling tepat adalah ....", "options": ["Membagikan kode agar rekening tidak mengalami pemblokiran", "Mengirimkan informasi rekening kepada pengirim pesan", "Mengabaikan seluruh informasi perbankan yang diterima", "Memeriksa informasi melalui layanan resmi lembaga keuangan"], "answer": 3, "why": "Bank tidak pernah meminta kode rahasia dan pesan bernada mendesak adalah ciri penipuan. Periksa informasi lewat layanan resmi bank."}, {"id": "mc11", "n": 11, "mod": 2, "stem": "Di sebuah kelas, beberapa siswa terbiasa berbicara ketika guru sedang menjelaskan. Akibatnya, siswa lain kesulitan memahami materi pelajaran. Tindakan yang paling sesuai dengan nilai dan norma sosial di sekolah adalah ....", "options": ["Membiarkan perilaku tersebut agar tidak terjadi konflik", "Menegur dengan sopan dan mengingatkan aturan kelas", "Mengeluarkan siswa tersebut dari kelas tanpa proses apa pun", "Membalas perilaku tersebut dengan mengganggu kegiatan pembelajaran"], "answer": 1, "why": "Menegur dengan sopan dan mengingatkan aturan kelas menjaga ketertiban tanpa kekerasan dan tanpa memperbesar konflik."}, {"id": "mc12", "n": 12, "mod": 2, "stem": "Warga suatu lingkungan memiliki kebiasaan kerja bakti membersihkan saluran air. Sebagian warga kemudian mengusulkan agar kegiatan tersebut dilakukan secara terjadwal. Usulan tersebut menunjukkan bahwa norma sosial dapat berfungsi untuk ....", "options": ["Membatasi seluruh aktivitas masyarakat tanpa pengecualian", "Menghapus perbedaan kebutuhan antaranggota masyarakat", "Mengatur perilaku agar kehidupan bersama lebih teratur", "Menggantikan seluruh keputusan individu dalam masyarakat"], "answer": 2, "why": "Kerja bakti yang terjadwal menunjukkan norma berfungsi mengatur perilaku agar kehidupan bersama lebih teratur."}, {"id": "mc13", "n": 13, "mod": 2, "stem": "Seorang siswa menemukan dompet di halaman sekolah. Di dalamnya terdapat uang dan kartu identitas pemiliknya. Tindakan yang paling mencerminkan nilai kejujuran dan tanggung jawab adalah ....", "options": ["Mengambil uangnya dan meninggalkan dompet di halaman", "Menyerahkan dompet kepada guru atau pihak sekolah", "Menyimpan dompet sampai pemiliknya datang sendiri", "Membagikan uang tersebut kepada teman-teman sekelas"], "answer": 1, "why": "Menyerahkan dompet kepada guru atau pihak sekolah menunjukkan kejujuran dan tanggung jawab, dan pemilik dapat menemukannya kembali."}, {"id": "mc14", "n": 14, "mod": 2, "stem": "Dalam suatu masyarakat, terdapat aturan untuk tidak membuang sampah ke sungai. Namun, beberapa warga tetap melanggarnya karena menganggap tindakan tersebut tidak langsung merugikan mereka. Analisis yang paling tepat terhadap kasus tersebut adalah ....", "options": ["Norma lingkungan tidak diperlukan jika sungai masih mengalir", "Perilaku individu tidak memiliki hubungan dengan kondisi masyarakat", "Norma perlu diterapkan karena dampak tindakan dapat dirasakan bersama", "Kebersihan sungai hanya menjadi tanggung jawab petugas kebersihan"], "answer": 2, "why": "Mencemari sungai merugikan semua orang di sekitarnya. Karena dampaknya dirasakan bersama, norma lingkungan perlu diterapkan."}, {"id": "mc15", "n": 15, "mod": 2, "stem": "Sebuah kelompok siswa memiliki anggota dari latar belakang budaya yang berbeda. Ketika menentukan pembagian tugas, mereka mendengarkan pendapat setiap anggota. Sikap tersebut menunjukkan penerapan nilai ....", "options": ["Persaingan tanpa memperhatikan kebutuhan anggota kelompok", "Keseragaman budaya dalam menentukan seluruh keputusan", "Pengutamaan kepentingan pribadi di atas kepentingan bersama", "Toleransi dan penghargaan terhadap perbedaan sosial budaya"], "answer": 3, "why": "Mendengarkan pendapat setiap anggota yang berbeda latar belakang menunjukkan toleransi dan penghargaan terhadap perbedaan."}, {"id": "mc16", "n": 16, "mod": 3, "stem": "Siswa melakukan penelitian tentang asal-usul nama sebuah kampung. Mereka menemukan bahwa nama kampung tersebut berkaitan dengan tumbuhan yang dahulu banyak tumbuh di wilayah itu. Kesimpulan yang paling tepat adalah ....", "options": ["Nama wilayah selalu ditentukan berdasarkan nama tokoh terkenal", "Toponimi dapat berkaitan dengan kondisi lingkungan suatu wilayah", "Nama wilayah tidak dapat digunakan untuk mempelajari sejarah lokal", "Setiap nama wilayah memiliki makna yang sama di seluruh daerah"], "answer": 1, "why": "Nama kampung yang berasal dari tumbuhan menunjukkan bahwa toponimi dapat berkaitan dengan kondisi lingkungan (flora)."}, {"id": "mc17", "n": 17, "mod": 3, "stem": "Dalam penelitian toponimi, siswa menemukan dua cerita berbeda mengenai asal-usul nama suatu tempat. Mereka kemudian mewawancarai tokoh masyarakat dan membandingkan informasi dengan sumber tertulis. Tindakan siswa tersebut menunjukkan ....", "options": ["Penggunaan satu cerita tanpa perlu memeriksa kebenarannya", "Penolakan terhadap informasi yang berasal dari masyarakat lokal", "Upaya memeriksa informasi melalui beberapa sumber", "Anggapan bahwa semua cerita sejarah pasti memiliki isi yang sama"], "answer": 2, "why": "Mewawancarai tokoh masyarakat lalu membandingkannya dengan sumber tertulis berarti memeriksa informasi melalui beberapa sumber."}, {"id": "mc18", "n": 18, "mod": 3, "stem": "Sebuah wilayah memiliki nama yang berkaitan dengan aktivitas perdagangan pada masa lalu. Saat ini, kegiatan perdagangan di wilayah tersebut sudah berkurang. Pernyataan yang paling tepat adalah ....", "options": ["Nama wilayah dapat menjadi petunjuk tentang aktivitas masyarakat masa lalu", "Perubahan aktivitas ekonomi menyebabkan nama wilayah kehilangan semua makna", "Sejarah wilayah hanya dapat diketahui melalui bangunan yang masih berdiri", "Nama wilayah tidak berhubungan dengan perubahan kehidupan masyarakat"], "answer": 0, "why": "Nama wilayah dapat merekam aktivitas masyarakat masa lalu, meskipun aktivitas itu kini sudah berkurang."}, {"id": "mc19", "n": 19, "mod": 3, "stem": "Siswa ingin meneliti sejarah nama sebuah jalan. Mereka hanya memperoleh informasi dari unggahan media sosial yang tidak mencantumkan sumber. Langkah penelitian yang paling tepat adalah ....", "options": ["Menggunakan informasi tersebut sebagai satu-satunya bukti sejarah", "Menghapus informasi tersebut karena media sosial tidak pernah bermanfaat", "Menerima informasi tersebut apabila sesuai dengan pendapat kelompok", "Memeriksa informasi melalui arsip, wawancara, dan sumber pendukung"], "answer": 3, "why": "Informasi tanpa sumber belum cukup kuat. Periksa dulu lewat arsip, wawancara, dan sumber pendukung lainnya."}, {"id": "mc20", "n": 20, "mod": 3, "stem": "Sebuah desa memiliki nama yang berkaitan dengan kelompok masyarakat yang pernah tinggal di wilayah tersebut. Dalam presentasinya, siswa menjelaskan sejarah nama desa dengan tetap menghargai masyarakat setempat. Sikap tersebut penting karena ....", "options": ["Penelitian sejarah harus menghindari semua informasi tentang budaya lokal", "Toponimi dapat membantu memahami hubungan antara tempat dan masyarakat", "Nama wilayah hanya digunakan untuk membedakan alamat administratif", "Sejarah lokal tidak perlu dikaitkan dengan kehidupan masyarakat sekarang"], "answer": 1, "why": "Toponimi membantu memahami hubungan antara tempat dan masyarakatnya, sehingga penyajiannya harus menghargai masyarakat setempat."}, {"id": "mc21", "n": 21, "mod": 0, "stem": "Sebuah wilayah perkotaan mengalami peningkatan suhu karena banyak lahan terbuka berubah menjadi bangunan dan permukaan beton. Pemerintah setempat ingin mengurangi dampak kondisi tersebut. Program yang paling sesuai adalah ....", "options": ["Menambah bangunan beton di ruang terbuka yang tersisa", "Mengurangi jumlah pohon agar perawatan lingkungan lebih mudah", "Menambah ruang hijau dan menggunakan permukaan yang menyerap air", "Memusatkan seluruh kegiatan warga di dalam gedung tertutup"], "answer": 2, "why": "Suhu naik karena lahan terbuka berubah menjadi beton. Ruang hijau dan permukaan yang menyerap air menurunkan suhu dan mengurangi genangan."}, {"id": "mc22", "n": 22, "mod": 0, "stem": "Nelayan di sebuah daerah memperoleh informasi bahwa gelombang laut diperkirakan tinggi selama beberapa hari. Sebagian nelayan tetap ingin melaut karena kebutuhan ekonomi keluarga. Keputusan yang paling mengutamakan keselamatan sekaligus mempertimbangkan kebutuhan ekonomi adalah ....", "options": ["Tetap melaut tanpa memperhatikan peringatan cuaca", "Menunda kegiatan melaut dan mencari alternatif pendapatan sementara", "Mengabaikan informasi cuaca karena pengalaman nelayan dianggap cukup", "Mengajak seluruh nelayan melaut agar pendapatan masyarakat meningkat"], "answer": 1, "why": "Keselamatan diutamakan. Menunda melaut sambil mencari pendapatan sementara menjaga keselamatan sekaligus kebutuhan ekonomi keluarga."}, {"id": "mc23", "n": 23, "mod": 0, "stem": "Di suatu desa, banjir terjadi setiap musim hujan. Warga biasanya hanya membersihkan rumah setelah banjir surut, tetapi belum melakukan pencegahan sebelum musim hujan. Evaluasi yang paling tepat terhadap tindakan warga tersebut adalah ....", "options": ["Tindakan sudah cukup karena banjir tidak dapat diperkirakan", "Penanganan setelah banjir perlu dilengkapi dengan tindakan pencegahan", "Warga sebaiknya tidak melakukan kegiatan apa pun selama musim hujan", "Banjir hanya dapat ditangani oleh pemerintah tanpa partisipasi masyarakat"], "answer": 1, "why": "Membersihkan setelah banjir saja bersifat reaktif. Perlu tindakan pencegahan dan kesiapsiagaan sebelum musim hujan."}, {"id": "mc24", "n": 24, "mod": 1, "stem": "Seorang siswa ingin membeli telepon genggam baru, meskipun telepon yang dimilikinya masih dapat digunakan. Ia mempertimbangkan menggunakan uang tabungan untuk membeli barang tersebut. Pertimbangan yang paling menunjukkan literasi keuangan adalah ....", "options": ["Membeli barang segera karena sedang menjadi tren", "Menggunakan seluruh tabungan agar tidak perlu menabung lagi", "Membandingkan kebutuhan, manfaat, harga, dan kondisi keuangan", "Meminjam uang tanpa menghitung kemampuan untuk mengembalikannya"], "answer": 2, "why": "Literasi keuangan berarti menimbang kebutuhan, manfaat, harga, dan kondisi keuangan sebelum membeli."}, {"id": "mc25", "n": 25, "mod": 1, "stem": "Seorang pedagang menggunakan layanan pembayaran digital. Suatu hari, ia menerima bukti pembayaran dari pembeli, tetapi dana belum masuk ke rekeningnya. Tindakan yang paling tepat dilakukan pedagang adalah ....", "options": ["Langsung menyerahkan barang tanpa memeriksa transaksi", "Memeriksa status transaksi melalui aplikasi atau layanan resmi", "Meminta pembeli mengirimkan kode rahasia rekeningnya", "Mengunggah data pribadi pembeli ke media sosial"], "answer": 1, "why": "Bukti pembayaran bisa dipalsukan. Periksa status transaksi lewat aplikasi atau layanan resmi sebelum menyerahkan barang."}, {"id": "mc26", "n": 26, "mod": 1, "stem": "Sebuah usaha kecil memperoleh pinjaman untuk membeli peralatan produksi. Setelah beberapa bulan, pendapatan usaha meningkat, tetapi pemilik kesulitan membayar cicilan karena tidak membuat perencanaan keuangan. Pelajaran yang paling tepat dari kasus tersebut adalah ....", "options": ["Pinjaman tidak boleh digunakan untuk kegiatan produktif", "Peningkatan pendapatan selalu menjamin kemampuan membayar cicilan", "Perencanaan arus kas penting dalam pengelolaan pinjaman usaha", "Semua keuntungan usaha harus digunakan untuk membeli peralatan baru"], "answer": 2, "why": "Pendapatan yang naik tidak otomatis menjamin mampu membayar cicilan. Perencanaan arus kas (uang masuk dan keluar) sangat penting."}, {"id": "mc27", "n": 27, "mod": 2, "stem": "Di sebuah lingkungan, warga memiliki kebiasaan menjaga kebersihan bersama. Namun, terdapat warga yang membuang sampah sembarangan karena merasa petugas kebersihan akan membersihkannya. Tindakan yang paling tepat untuk memperkuat norma sosial adalah ....", "options": ["Membiarkan perilaku tersebut karena kebersihan merupakan urusan petugas", "Memberikan edukasi, menyediakan fasilitas, dan menerapkan aturan secara adil", "Melarang seluruh warga menggunakan tempat sampah umum", "Menyebarkan identitas pelanggar tanpa melakukan klarifikasi"], "answer": 1, "why": "Norma kuat jika ada edukasi, fasilitas yang memadai, dan aturan yang ditegakkan secara adil, bukan pembiaran atau hukuman sepihak."}, {"id": "mc28", "n": 28, "mod": 2, "stem": "Dalam musyawarah kelas, dua kelompok memiliki pendapat yang berbeda mengenai kegiatan akhir semester. Ketua kelas memberikan kesempatan kepada setiap kelompok untuk menyampaikan alasan. Sikap ketua kelas tersebut mencerminkan ....", "options": ["Pemaksaan keputusan oleh pihak yang memiliki jabatan", "Penghargaan terhadap pendapat dan penyelesaian masalah secara musyawarah", "Penghindaran konflik dengan membatalkan seluruh kegiatan kelas", "Pemberian hak berbicara hanya kepada kelompok yang lebih banyak anggotanya"], "answer": 1, "why": "Memberi kesempatan kepada setiap kelompok menyampaikan alasan adalah ciri musyawarah: menghargai pendapat dan mencari kesepakatan."}, {"id": "mc29", "n": 29, "mod": 2, "stem": "Sebuah aturan sekolah melarang siswa menyontek ketika ujian. Seorang siswa berpendapat bahwa aturan tersebut hanya merugikan siswa yang belum belajar. Analisis yang paling tepat adalah ....", "options": ["Aturan dibuat untuk menjaga kejujuran dan keadilan dalam penilaian", "Aturan tidak diperlukan jika sebagian siswa tetap memperoleh nilai tinggi", "Menyontek dapat dibenarkan apabila siswa mengalami kesulitan belajar", "Aturan hanya berlaku bagi siswa yang pernah melakukan pelanggaran"], "answer": 0, "why": "Larangan menyontek dibuat untuk menjaga kejujuran dan keadilan penilaian bagi semua siswa."}, {"id": "mc30", "n": 30, "mod": 3, "stem": "Siswa menemukan bahwa nama suatu wilayah berasal dari ciri geografis yang dahulu terlihat jelas, tetapi kini telah mengalami perubahan akibat pembangunan. Kesimpulan yang paling tepat adalah ....", "options": ["Toponimi dapat menjadi petunjuk perubahan lingkungan dan penggunaan ruang", "Perubahan lingkungan menyebabkan nama wilayah tidak lagi memiliki nilai sejarah", "Nama tempat hanya menggambarkan kondisi wilayah pada masa sekarang", "Sejarah geografis suatu wilayah tidak dapat ditelusuri melalui nama tempat"], "answer": 0, "why": "Ciri geografis yang terekam dalam nama tempat tetap menjadi petunjuk perubahan lingkungan dan penggunaan ruang, walaupun bentuk aslinya sudah berubah."}, {"id": "mc31", "n": 31, "mod": 3, "stem": "Dalam penelitian asal-usul nama kampung, siswa memperoleh cerita lisan dari tokoh masyarakat. Cerita tersebut tidak memiliki dokumen pendukung, tetapi dianggap penting oleh masyarakat setempat. Cara menggunakan informasi tersebut adalah ....", "options": ["Menolak cerita lisan karena semua informasi sejarah harus berbentuk dokumen", "Menerima cerita sebagai fakta mutlak tanpa melakukan pemeriksaan", "Mencatat cerita sebagai sumber lisan dan membandingkannya dengan sumber lain", "Mengubah cerita agar sesuai dengan informasi yang ditemukan di internet"], "answer": 2, "why": "Cerita lisan adalah sumber yang sah. Catat sebagai sumber lisan lalu bandingkan dengan sumber lain, jangan langsung dianggap mutlak atau ditolak."}, {"id": "mc32", "n": 32, "mod": 3, "stem": "Sebuah kelompok siswa meneliti nama wilayah yang berkaitan dengan kedatangan kelompok masyarakat dari daerah lain. Mereka menemukan adanya pengaruh bahasa, budaya, dan aktivitas ekonomi dalam sejarah wilayah tersebut. Kesimpulan yang paling tepat adalah ....", "options": ["Toponimi hanya berkaitan dengan perubahan batas administratif", "Nama wilayah dapat mencerminkan interaksi dan perjalanan sejarah masyarakat", "Perpindahan masyarakat tidak memiliki hubungan dengan perkembangan wilayah", "Pengaruh budaya luar selalu menghilangkan seluruh identitas masyarakat setempat"], "answer": 1, "why": "Pengaruh bahasa, budaya, dan ekonomi pada nama wilayah mencerminkan interaksi dan perjalanan sejarah masyarakatnya."}], "tf": [{"id": "tf01", "mod": 0, "stem": "Adaptasi perubahan iklim dapat dilakukan dengan menyesuaikan kegiatan manusia terhadap risiko yang muncul akibat perubahan kondisi lingkungan.", "answer": true, "why": "Benar. Adaptasi adalah penyesuaian kegiatan manusia terhadap risiko akibat perubahan kondisi lingkungan."}, {"id": "tf02", "mod": 0, "stem": "Penanaman mangrove hanya memiliki manfaat estetika dan tidak berkaitan dengan perlindungan wilayah pesisir.", "answer": false, "why": "Salah. Akar mangrove meredam gelombang dan mencegah abrasi, jadi mangrove melindungi wilayah pesisir, bukan sekadar hiasan."}, {"id": "tf03", "mod": 0, "stem": "Informasi cuaca dapat digunakan masyarakat untuk menentukan kegiatan yang lebih aman dan sesuai dengan kondisi lingkungan.", "answer": true, "why": "Benar. Informasi cuaca membantu masyarakat memilih kegiatan yang lebih aman dan sesuai kondisi lingkungan."}, {"id": "tf04", "mod": 0, "stem": "Adaptasi perubahan iklim hanya menjadi tanggung jawab pemerintah sehingga masyarakat tidak perlu berpartisipasi.", "answer": false, "why": "Salah. Adaptasi perlu kerja sama pemerintah, masyarakat, dan lembaga lain. Partisipasi masyarakat sangat penting."}, {"id": "tf05", "mod": 1, "stem": "Lembaga keuangan dapat mendukung kegiatan ekonomi melalui layanan penyimpanan dana dan penyaluran pembiayaan.", "answer": true, "why": "Benar. Lembaga keuangan menghimpun dana (simpanan) dan menyalurkannya (pembiayaan) untuk mendukung kegiatan ekonomi."}, {"id": "tf06", "mod": 1, "stem": "Seseorang sebaiknya mengambil pinjaman tanpa mempertimbangkan bunga, jangka waktu, dan kemampuan membayar.", "answer": false, "why": "Salah. Sebelum meminjam, bunga, jangka waktu, dan kemampuan membayar harus dipertimbangkan agar tidak terjerat kredit macet."}, {"id": "tf07", "mod": 1, "stem": "Membuat anggaran pemasukan dan pengeluaran dapat membantu seseorang mengelola keuangan secara lebih terencana.", "answer": true, "why": "Benar. Anggaran membantu membagi pemasukan untuk kebutuhan, tabungan, dan pengeluaran lain secara terencana."}, {"id": "tf08", "mod": 1, "stem": "Semua lembaga keuangan memiliki fungsi, layanan, dan ketentuan yang persis sama.", "answer": false, "why": "Salah. Setiap lembaga keuangan punya fungsi, layanan, dan ketentuan yang berbeda, misalnya bank sentral berbeda dari bank umum atau koperasi."}, {"id": "tf09", "mod": 2, "stem": "Nilai sosial berkaitan dengan sesuatu yang dianggap baik, penting, atau berharga oleh masyarakat.", "answer": true, "why": "Benar. Nilai sosial adalah sesuatu yang dianggap baik, penting, atau berharga oleh masyarakat."}, {"id": "tf10", "mod": 2, "stem": "Norma sosial tidak berhubungan dengan perilaku manusia dalam kehidupan bersama.", "answer": false, "why": "Salah. Norma sosial adalah pedoman perilaku dalam kehidupan bersama, jadi sangat berhubungan dengan perilaku manusia."}, {"id": "tf11", "mod": 2, "stem": "Penerapan norma sosial dapat membantu menciptakan keteraturan dan mengurangi konflik dalam masyarakat.", "answer": true, "why": "Benar. Norma yang dipatuhi menciptakan keteraturan dan mengurangi konflik."}, {"id": "tf12", "mod": 2, "stem": "Menghargai perbedaan pendapat berarti seseorang harus selalu menerima semua pendapat tanpa mempertimbangkan alasan dan dampaknya.", "answer": false, "why": "Salah. Menghargai perbedaan pendapat tidak berarti menerima semuanya tanpa menimbang. Pendapat tetap dinilai dari alasan dan dampaknya."}, {"id": "tf13", "mod": 3, "stem": "Toponimi merupakan kajian tentang nama tempat dan dapat digunakan untuk menelusuri sejarah suatu wilayah.", "answer": true, "why": "Benar. Toponimi adalah kajian tentang nama tempat dan dapat dipakai menelusuri sejarah wilayah."}, {"id": "tf14", "mod": 3, "stem": "Informasi lisan dari masyarakat tidak boleh digunakan dalam penelitian toponimi dalam keadaan apa pun.", "answer": false, "why": "Salah. Sumber lisan boleh digunakan, asalkan dicatat dengan jelas dan dibandingkan dengan sumber lain."}, {"id": "tf15", "mod": 3, "stem": "Nama suatu wilayah dapat berkaitan dengan lingkungan, aktivitas masyarakat, tokoh, bahasa, atau peristiwa masa lalu.", "answer": true, "why": "Benar. Nama wilayah dapat berkaitan dengan lingkungan, aktivitas, tokoh, bahasa, atau peristiwa masa lalu."}, {"id": "tf16", "mod": 3, "stem": "Penelitian sejarah lokal akan lebih kuat apabila peneliti membandingkan informasi dari beberapa sumber yang relevan.", "answer": true, "why": "Benar. Membandingkan beberapa sumber yang relevan membuat kesimpulan penelitian lebih kuat."}], "match": [{"id": "mt01", "mod": 0, "term": "Adaptasi", "def": "Penyesuaian aktivitas manusia terhadap risiko perubahan lingkungan", "inFinal": true, "inModule": true}, {"id": "mt02", "mod": 1, "term": "Lembaga keuangan", "def": "Lembaga yang menghimpun dan/atau menyalurkan dana", "inFinal": true, "inModule": true}, {"id": "mt03", "mod": 2, "term": "Nilai sosial", "def": "Sesuatu yang dianggap baik, penting, atau berharga", "inFinal": true, "inModule": true}, {"id": "mt04", "mod": 3, "term": "Toponimi", "def": "Kajian tentang nama tempat", "inFinal": true, "inModule": true}, {"id": "mt05", "mod": 0, "term": "Mangrove", "def": "Vegetasi pesisir yang membantu menjaga ekosistem", "inFinal": true, "inModule": true}, {"id": "mt06", "mod": 1, "term": "Bank Indonesia", "def": "Bank sentral", "inFinal": true, "inModule": true}, {"id": "mt07", "mod": 2, "term": "Norma sosial", "def": "Pedoman atau aturan perilaku", "inFinal": true, "inModule": true}, {"id": "mt08", "mod": 1, "term": "Kredit macet", "def": "Kondisi ketika kewajiban pinjaman bermasalah/tidak dibayar sesuai jadwal", "inFinal": true, "inModule": true}, {"id": "mt09", "mod": 0, "term": "Informasi cuaca", "def": "Dasar merencanakan kegiatan yang lebih aman", "inFinal": true, "inModule": true}, {"id": "mt10", "mod": 1, "term": "Bank umum", "def": "Menyediakan layanan perbankan kepada masyarakat", "inFinal": true, "inModule": false}, {"id": "mt11", "mod": 2, "term": "Toleransi", "def": "Menghargai perbedaan", "inFinal": true, "inModule": true}, {"id": "mt12", "mod": 3, "term": "Sumber lisan", "def": "Informasi dari wawancara atau cerita masyarakat", "inFinal": true, "inModule": true}, {"id": "mt13", "mod": 0, "term": "Daerah resapan", "def": "Area yang membantu air meresap ke tanah", "inFinal": true, "inModule": true}, {"id": "mt14", "mod": 1, "term": "Anggaran", "def": "Rencana pemasukan dan pengeluaran", "inFinal": true, "inModule": true}, {"id": "mt15", "mod": 2, "term": "Musyawarah", "def": "Pembahasan bersama untuk mencapai kesepakatan", "inFinal": true, "inModule": true}, {"id": "mt16", "mod": 3, "term": "Arsip", "def": "Dokumen yang dapat mendukung penelitian sejarah", "inFinal": true, "inModule": true}, {"id": "mt17", "mod": 3, "term": "Peta lama", "def": "Peta dari masa lalu yang memperlihatkan bentuk wilayah dan nama tempat pada waktu itu", "inFinal": false, "inModule": true}], "short": [{"id": "sa01", "mod": 0, "stem": "Sebuah sekolah berada di daerah yang sering mengalami banjir akibat saluran air tersumbat. Sebutkan dua tindakan adaptasi yang dapat dilakukan sekolah untuk mengurangi risiko banjir.", "kw": ["membersihkan saluran", "daerah resapan", "menanam", "mengelola sampah", "peringatan", "kesiapsiagaan"], "plus": ["bersihkan saluran", "bersih saluran", "saluran air", "resapan", "biopori", "sumur resapan", "tanam pohon", "buang sampah", "kerja bakti", "jalur evakuasi", "siaga", "kesiapsiagaan"], "model": "(1) Membersihkan saluran air dan mengelola sampah secara rutin lewat kerja bakti agar air mengalir lancar. (2) Menambah daerah resapan, misalnya sumur resapan atau biopori, serta menanam pohon di halaman. Sekolah juga dapat menyiapkan jalur evakuasi dan memantau peringatan cuaca."}, {"id": "sa02", "mod": 0, "stem": "Mengapa masyarakat perlu menggunakan informasi cuaca ketika merencanakan kegiatan di wilayah yang berisiko mengalami cuaca ekstrem?", "kw": ["risiko", "aman", "korban", "kerugian", "pencegahan"], "plus": ["bahaya", "selamat", "keselamatan", "waspada", "siap", "persiapan", "antisipasi", "rencana", "peringatan dini", "bmkg", "prakiraan"], "model": "Informasi cuaca membantu masyarakat mengenali risiko lebih awal sehingga dapat memilih kegiatan yang aman, mencegah korban dan kerugian, serta menyiapkan tindakan pencegahan."}, {"id": "sa03", "mod": 0, "stem": "Jelaskan satu hubungan antara penanaman mangrove dan kehidupan masyarakat pesisir.", "kw": ["melindungi pesisir", "abrasi", "habitat", "mata pencaharian", "ekosistem"], "plus": ["lindungi", "gelombang", "banjir rob", "ikan", "udang", "kepiting", "nelayan", "wisata", "penghasilan", "pendapatan", "tempat hidup", "erosi"], "model": "Akar mangrove meredam gelombang dan mencegah abrasi sehingga melindungi permukiman pesisir. Mangrove juga menjadi habitat ikan, udang, dan kepiting yang menopang mata pencaharian nelayan."}, {"id": "sa04", "mod": 0, "stem": "Mengapa adaptasi perubahan iklim perlu dilakukan bersama oleh pemerintah, masyarakat, dan lembaga lainnya?", "kw": ["banyak pihak", "tanggung jawab", "kerja sama", "berkelanjutan"], "plus": ["bersama", "gotong royong", "kolaborasi", "sumber daya", "dukungan", "terbatas", "saling melengkapi", "semua pihak", "lintas", "luas"], "model": "Dampak perubahan iklim luas dan tidak dapat diatasi satu pihak. Pemerintah menyediakan kebijakan dan fasilitas, masyarakat menjalankannya di lingkungan sendiri, dan lembaga lain memberi ilmu atau dana. Dengan kerja sama, tanggung jawab terbagi dan hasilnya berkelanjutan."}, {"id": "sa05", "mod": 1, "stem": "Seorang siswa ingin membeli barang yang tidak mendesak. Tuliskan dua pertanyaan yang perlu dipertimbangkan sebelum menggunakan tabungannya.", "kw": ["dibutuhkan", "tabungan", "harga", "kemampuan", "hemat"], "plus": ["butuh", "kebutuhan", "perlu", "mendesak", "manfaat", "cukup", "uang", "sisa", "dana darurat", "murah", "tunda", "keinginan", "hemat", "kemampuan", "harga"], "model": "(1) Apakah barang ini benar-benar dibutuhkan atau hanya keinginan? (2) Apakah harganya sesuai dan uang tabungan saya masih cukup untuk kebutuhan lain dan dana darurat?"}, {"id": "sa06", "mod": 1, "stem": "Mengapa seseorang perlu menghitung kemampuan membayar sebelum mengambil pinjaman?", "kw": ["cicilan", "pendapatan", "bunga", "jangka waktu", "risiko"], "plus": ["tenor", "gagal bayar", "macet", "utang", "denda", "sanggup", "mampu", "penghasilan", "beban", "menunggak", "melunasi"], "model": "Cicilan, bunga, dan jangka waktu pinjaman harus dibayar dari pendapatan. Jika kemampuan membayar tidak dihitung, risiko gagal bayar dan kredit macet meningkat."}, {"id": "sa07", "mod": 1, "stem": "Sebutkan dua contoh perilaku aman ketika menggunakan layanan keuangan digital.", "kw": ["pin", "kata sandi", "otp", "resmi", "transaksi", "mencurigakan"], "plus": ["password", "rahasia", "jangan bagikan", "tidak membagikan", "tautan", "link", "aplikasi resmi", "verifikasi", "waspada", "phishing", "cvv", "notifikasi", "memeriksa", "cek", "laporkan"], "model": "(1) Tidak membagikan PIN, OTP, dan kata sandi kepada siapa pun. (2) Memakai aplikasi atau layanan resmi dan memeriksa transaksi atau pesan yang mencurigakan sebelum bertindak."}, {"id": "sa08", "mod": 1, "stem": "Jelaskan manfaat membuat anggaran pemasukan dan pengeluaran bagi keluarga.", "kw": ["aliran uang", "prioritas", "pengeluaran", "tabungan", "darurat"], "plus": ["mengatur", "terencana", "kebutuhan", "boros", "hemat", "utang", "tujuan", "men  <g fill="none" stroke="rgba(34,228,255,.14)" stroke-width="1.5"><circle cx="600" cy="380" r="150"/><circle cx="600" cy="380" r="260" stroke-dasharray="4 10"/><circle cx="600" cy="380" r="380"/><circle cx="600" cy="380" r="520" stroke-dasharray="2 12"/><path d="M0 380H1200M600 0V720" stroke-dasharray="3 9"/></g>

   const x1=a.x+ux*52,y1=a.y+uy*52,x2=b.x-ux*52,y2=b.y-uy*52;const done=doneArr[k];

{title:'Informasi cuaca dan kesiapsiagaan',icon:'bolt',wide:true,
html:`<p>Informasi cuaca adalah "mata" pertama dalam adaptasi. <b>BMKG</b> (Badan Meteorologi, Klimatologi, dan Geofisika) menyediakan prakiraan cuaca, peringatan dini cuaca ekstrem, informasi tinggi gelombang, dan prakiraan musim. Informasi ini dapat dilihat lewat situs dan aplikasi resmi BMKG.</p>
<h4>Dari informasi menjadi tindakan</h4>
${FL([['Terima','Ambil informasi dari sumber resmi'],['Pahami','Apa artinya untuk tempatku?'],['Putuskan','Kegiatan apa yang aman?'],['Bertindak','Tunda, siapkan, atau mengungsi'],['Bagikan','Kabari tetangga dengan benar']])}
<h4>Kesiapsiagaan yang bisa disiapkan</h4>
<ul><li>Tas siaga berisi dokumen penting, obat, senter, dan air minum.</li><li>Mengetahui jalur evakuasi dan titik kumpul.</li><li>Menyimpan nomor darurat, misalnya 112.</li><li>Membersihkan saluran air sebelum musim hujan, bukan setelah banjir.</li></ul>
<p><b>Contoh keputusan:</b> nelayan menunda melaut saat ada peringatan gelombang tinggi sambil mencari penghasilan sementara; petani menyesuaikan waktu tanam dengan prakiraan musim; sekolah menghentikan kegiatan luar ruang saat cuaca ekstrem.</p>`,

{title:'Mangrove, ruang hijau, daerah resapan, dan diversifikasi mata pencaharian',icon:'leaf',vis:()=>ART.coast(),cap:'Akar mangrove meredam gelombang, menahan lumpur, dan menjadi rumah bagi biota laut.',
html:`<h4>Mangrove</h4><p>Hutan mangrove tumbuh di pantai berlumpur. Akarnya yang rapat <b>meredam gelombang</b> dan menahan lumpur sehingga mencegah abrasi. Mangrove juga menjadi <b>habitat</b> ikan, udang, dan kepiting, serta menyimpan karbon dalam jumlah besar (disebut karbon biru).</p>
<h4>Ruang hijau</h4><p>Pohon peneduh dan taman menurunkan suhu, menyerap karbon dioksida, dan membuat lingkungan nyaman. Kota yang penuh beton lebih panas (efek pulau panas kota).</p>
<h4>Daerah resapan</h4><p>Tanah terbuka, taman, sumur resapan, lubang resapan biopori, dan paving berpori membantu air hujan meresap. Genangan berkurang dan cadangan air tanah terjaga.</p>
<h4>Diversifikasi mata pencaharian</h4><p>Artinya tidak menggantungkan hidup pada satu sumber penghasilan. Nelayan dapat mengolah hasil laut, budidaya rumput laut, atau mengelola wisata mangrove. Petani dapat memilih tanaman tahan kering dan menambah usaha olahan.</p>`,

{title:'Pengantar: ke mana uang mengalir?',icon:'coin',vis:()=>ART.moneyflow(),cap:'Lembaga keuangan mempertemukan orang yang punya dana dengan orang yang membutuhkan dana.',
html:`<p><b>Lembaga keuangan</b> adalah lembaga yang menghimpun dan/atau menyalurkan dana. Keluarga menyimpan uang di sana (menabung), lalu lembaga menyalurkannya sebagai pinjaman kepada pelaku usaha atau orang yang membutuhkan.</p>
<p>Peran ini disebut <b>perantara keuangan</b>. Tanpa lembaga keuangan, pedagang sulit mendapat modal, pembayaran antardaerah sulit dilakukan, dan uang tunai menumpuk di rumah tanpa perlindungan.</p>
<p>Mengapa penting bagimu? Karena setiap orang akan mengambil keputusan keuangan: menabung, membeli, meminjam, atau membayar secara digital. Keputusan yang bertanggung jawab dimulai dari pengetahuan.</p>`,
fact:'Menyimpan uang di bank biasanya lebih aman daripada di rumah, karena ada sistem pengamanan dan pengawasan resmi.',
terms:[['Simpanan','Dana masyarakat yang dititipkan di lembaga keuangan.'],['Kredit','Pinjaman uang yang harus dikembalikan dengan bunga.'],['Bunga','Imbalan bagi penabung atau biaya bagi peminjam.'],['Intermediasi','Menghubungkan pemilik dana dengan pengguna dana.']]},

{title:'Peran lembaga keuangan dalam produksi, distribusi, dan konsumsi',icon:'chart',wide:true,
html:`${TB(['Kegiatan','Peran lembaga keuangan','Contoh'],[
['<b>Produksi</b>','Menyediakan modal usaha','Kredit modal kerja bagi UMKM, misalnya Kredit Usaha Rakyat melalui bank'],
['<b>Distribusi</b>','Memperlancar pembayaran dan pengiriman uang antardaerah','Transfer antarbank, QRIS, pengiriman uang'],
['<b>Konsumsi</b>','Membantu merencanakan dan membiayai kebutuhan','Tabungan pendidikan, cicilan rumah, pembayaran nontunai']])}
<p><b>Kisah Bu Sari:</b> warungnya butuh modal untuk menambah stok (produksi/usaha). Pembeli membayar lewat QRIS (distribusi pembayaran). Ia juga menabung untuk biaya sekolah anaknya (konsumsi terencana). Ketiganya berhubungan dengan lembaga keuangan.</p>`,
quick:{title:'Tantangan kilat: produksi, distribusi, atau konsumsi?',items:[
{q:'Petani memakai kredit usaha untuk membeli benih dan pupuk.',o:['Produksi','Distribusi','Konsumsi'],a:0,why:'Kredit dipakai untuk kegiatan menghasilkan barang, jadi ini produksi.'},
{q:'Toko daring menerima pembayaran pembeli dari kota lain lewat transfer.',o:['Produksi','Distribusi','Konsumsi'],a:1,why:'Transfer memperlancar pembayaran antardaerah, bagian dari distribusi.'},
{q:'Keluarga menabung untuk biaya sekolah anak.',o:['Produksi','Distribusi','Konsumsi'],a:2,why:'Menabung untuk kebutuhan keluarga terkait konsumsi yang direncanakan.'},
{q:'Pabrik tempe meminjam uang untuk membeli mesin penggiling.',o:['Produksi','Distribusi','Konsumsi'],a:0,why:'Mesin dipakai memproduksi, jadi pinjaman itu mendukung produksi.'}]}},

{title:'Bank Indonesia, bank umum, dan BPR',icon:'scale',wide:true,
html:`${TB(['Lembaga','Fungsi utama','Melayani'],[
['<b>Bank Indonesia</b> (bank sentral)','Menjaga stabilitas nilai rupiah, mengatur sistem pembayaran (misalnya QRIS), dan mengedarkan uang rupiah','Perbankan dan sistem keuangan, bukan rekening tabungan perorangan'],
['<b>Bank umum</b>','Menghimpun simpanan (tabungan, giro, deposito), menyalurkan kredit, dan menyediakan transfer serta layanan digital','Masyarakat umum dan pelaku usaha. Contoh: bank nasional dan bank daerah seperti Bank SulutGo'],
['<b>BPR</b> (Bank Perekonomian Rakyat)','Melayani penyimpanan dan pinjaman untuk masyarakat dan usaha mikro-kecil di wilayah tertentu; tidak menyediakan layanan giro','Masyarakat dan pelaku usaha kecil setempat']])}
<h4>Lembaga keuangan bukan bank</h4><p>Koperasi simpan pinjam, pegadaian, asuransi, dana pensiun, dan perusahaan pembiayaan. Koperasi sekolah adalah contoh yang dekat denganmu: dikelola berdasarkan aturan yang disepakati anggota.</p>
<h4>Siapa yang mengawasi?</h4><p><b>OJK</b> (Otoritas Jasa Keuangan) mengawasi lembaga jasa keuangan. <b>LPS</b> menjamin simpanan nasabah bank sesuai ketentuan (hingga Rp2 miliar per nasabah per bank).</p>`,
fact:'Kamu tidak membuka tabungan di Bank Indonesia. Namun uang rupiah yang kamu pegang diedarkan oleh Bank Indonesia.',
terms:[['Bank sentral','Bank yang menjaga stabilitas nilai mata uang dan sistem pembayaran.'],['BPR','Bank yang melayani masyarakat dan usaha kecil di wilayah tertentu.'],['OJK','Lembaga pengawas jasa keuangan.'],['LPS','Lembaga penjamin simpanan.']],
quick:{title:'Tantangan kilat: lembaga apa yang tepat?',items:[
{q:'Mengedarkan uang rupiah dan menjaga stabilitas nilai rupiah.',o:['Bank Indonesia','Bank umum','Koperasi sekolah'],a:0,why:'Itu tugas bank sentral, yaitu Bank Indonesia.'},
{q:'Pedagang kecil ingin pinjaman dari lembaga perbankan yang melayani wilayah sekitar.',o:['Bank Indonesia','BPR','Perusahaan asuransi'],a:1,why:'BPR melayani masyarakat dan usaha kecil di wilayah tertentu.'},
{q:'Siswa ingin membuka tabungan dan memakai kartu debit.',o:['Bank umum','Bank Indonesia','Dana pensiun'],a:0,why:'Bank umum menyediakan tabungan, kartu, dan layanan digital untuk masyarakat.'}]}},

{title:'Tabungan, pinjaman, anggaran, dan kemampuan membayar',icon:'clip',calc:true,wide:true,
html:`<p><b>Menabung</b> membuat uang aman dan dapat menghasilkan bunga. <b>Meminjam</b> membantu memenuhi kebutuhan mendesak atau modal usaha, tetapi harus dikembalikan beserta <b>bunga</b> dalam <b>jangka waktu</b> tertentu (cicilan).</p>
<h4>Sebelum meminjam, hitung dulu</h4><ul><li>Berapa bunga dan biaya lainnya?</li><li>Berapa lama jangka waktunya?</li><li>Berapa cicilan per bulan dibanding pendapatan? Banyak perencana keuangan menyarankan total cicilan tidak lebih dari sekitar 30% penghasilan.</li></ul>
<h4>Anggaran</h4><p><b>Anggaran</b> adalah rencana pemasukan dan pengeluaran. Salah satu contoh pembagian populer adalah 50% kebutuhan, 30% keinginan, dan 20% tabungan atau dana darurat. Angka ini bisa disesuaikan dengan kondisi keluarga.</p>
<h4>Pertanyaan sebelum membeli</h4><ul><li>Apakah benar-benar dibutuhkan atau hanya keinginan?</li><li>Apakah harganya sesuai manfaatnya?</li><li>Apakah kemampuan keuanganku cukup, tanpa menghabiskan tabungan?</li></ul>
<p>Coba simulasi di bawah. Ini simulasi sederhana dengan bunga tetap (flat) untuk latihan; ketentuan sebenarnya berbeda tiap lembaga.</p>`,
terms:[['Cicilan','Pembayaran pinjaman secara bertahap.'],['Anggaran','Rencana pemasukan dan pengeluaran.'],['Dana darurat','Simpanan untuk kebutuhan mendadak.'],['Kemampuan membayar','Kesanggupan membayar cicilan dari pendapatan.']]},

{title:'Keamanan layanan keuangan digital dan risiko kredit macet',icon:'shield',vis:()=>ART.shield(),cap:'Bank dan OJK tidak pernah meminta OTP atau PIN-mu.',
html:`<p>QRIS, dompet digital, dan aplikasi bank memudahkan hidup, tetapi penipu juga mengincar data. Lima kebiasaan aman:</p>
<ol><li>Jangan bagikan <b>OTP, PIN, kata sandi, dan CVV</b> kepada siapa pun, termasuk yang mengaku petugas bank.</li><li>Jangan klik tautan dari pesan yang tidak dikenal.</li><li>Gunakan <b>aplikasi dan layanan resmi</b>, dan periksa status transaksi.</li><li>Hindari pinjaman online ilegal. Cek izin lembaga di OJK.</li><li>Jika curiga, hubungi layanan resmi. Kontak OJK: 157.</li></ol>
<h4>Kredit macet</h4><p>Kredit macet terjadi ketika kewajiban pinjaman tidak dibayar sesuai jadwal. Akibatnya: denda, catatan buruk yang menyulitkan pinjaman berikutnya, dan agunan dapat disita. Pencegahannya: pinjam sesuai kemampuan, buat perencanaan arus kas, dan pilih lembaga yang legal.</p>`,
fact:'OJK menegaskan tidak pernah meminta uang, data, atau informasi pribadi rekening konsumen kepada siapa pun.',
terms:[['OTP','Kode sekali pakai untuk verifikasi. Rahasia!'],['Phishing','Penipuan yang memancing korban membuka tautan atau memberi data.'],['Kredit macet','Kewajiban pinjaman bermasalah atau tidak dibayar sesuai jadwal.']],
quick:{title:'Detektif penipuan: asli atau penipuan?',items:[
{sms:'[BANK] Rekening Anda akan DIBLOKIR hari ini. Balas dengan kode OTP untuk verifikasi.',q:'Pesan ini masuk ke ponselmu. Apa penilaianmu?',o:['Pesan resmi','Penipuan'],a:1,why:'Bank tidak meminta OTP lewat pesan dan pesan bernada mendesak adalah ciri penipuan.'},
{sms:'Kode OTP Anda: 482913. Jangan berikan kepada siapa pun, termasuk pihak bank.',q:'Kamu baru saja masuk ke aplikasi banking milikmu sendiri. Pesan ini?',o:['Pesan resmi (jangan dibagikan)','Penipuan'],a:0,why:'Ini kode resmi karena kamu sedang login. Tetap simpan sendiri dan jangan bagikan.'},
{sms:'Selamat! Kamu memenangkan hadiah Rp10 juta. Klik tautan ini dan isi PIN kartu untuk klaim hadiah.',q:'Bagaimana menilainya?',o:['Pesan resmi','Penipuan'],a:1,why:'Hadiah tak terduga dan permintaan PIN adalah modus penipuan (phishing).'},
{sms:'Pinjaman cair 5 menit, tanpa syarat, tanpa cek data! Instal aplikasi dan izinkan akses kontak dan galeri.',q:'Apa yang tepat kamu lakukan?',o:['Instal karena praktis','Abaikan dan laporkan; cek izin di OJK'],a:1,why:'Pinjaman ilegal sering menyalahgunakan data pribadi. Selalu cek izin di OJK.'}]}},

html:`<ul><li><b>Lembaga keuangan</b> menghimpun dan menyalurkan dana untuk mendukung produksi, distribusi, dan konsumsi.</li><li><b>Bank Indonesia</b> adalah bank sentral; <b>bank umum</b> dan <b>BPR</b> melayani masyarakat; koperasi adalah lembaga bukan bank.</li><li><b>Anggaran</b> dan perhitungan <b>kemampuan membayar</b> mencegah kredit macet.</li><li>Jaga <b>OTP, PIN, dan kata sandi</b>; periksa transaksi lewat layanan resmi.</li></ul>${TIP('Siap? Latih kartu istilah, lalu tembus asesmen 20 soal dengan nilai minimal 85%.')}`}
