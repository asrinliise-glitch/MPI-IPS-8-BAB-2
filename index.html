/* -------------------- MODUL 3 -------------------- */
[
{title:'Pengantar: mengapa manusia butuh pedoman?',icon:'scale',wide:true,
html:`<p>Manusia hidup bersama. Setiap orang punya keinginan dan kebiasaan berbeda. Tanpa pedoman, konflik mudah terjadi. Karena itu masyarakat memiliki <b>nilai</b> dan <b>norma</b>.</p>
${FL([['Nilai sosial','Sesuatu yang dianggap baik, penting, atau berharga'],['Norma sosial','Pedoman atau aturan perilaku'],['Perilaku','Tindakan sehari-hari'],['Keteraturan','Hidup bersama lebih tertib dan damai']])}
<p><b>Contoh:</b> masyarakat menghargai <b>kejujuran</b> (nilai). Dari nilai itu lahir aturan <b>dilarang menyontek</b> (norma). Siswa yang patuh berperilaku jujur saat ujian, sehingga penilaian menjadi adil dan kelas menjadi tertib.</p>`,
fact:'Norma tidak hanya tertulis. Banyak norma berupa kebiasaan yang diwariskan, misalnya mengucap salam atau bergotong royong.',
terms:[['Nilai sosial','Sesuatu yang dianggap baik, penting, atau berharga oleh masyarakat.'],['Norma sosial','Pedoman atau aturan perilaku dalam masyarakat.'],['Sanksi','Akibat yang diterima jika melanggar norma.']]},

{title:'Nilai sosial dan norma sosial',icon:'book',wide:true,
html:`${CO([['Nilai sosial',['Ukuran tentang apa yang baik dan berharga','Contoh: kejujuran, gotong royong, tanggung jawab, toleransi, keadilan','Bersifat abstrak']],['Norma sosial',['Aturan tentang apa yang boleh dan tidak boleh dilakukan','Contoh: dilarang menyontek, wajib antre','Bersifat lebih konkret dan ada sanksi']]])}
<h4>Jenis norma</h4>
${TB(['Norma','Sumber','Contoh','Sanksi'],[
['Agama','Ajaran agama','Beribadah, berbuat baik','Dosa, rasa bersalah'],
['Kesusilaan','Hati nurani','Jujur meskipun tidak ada yang melihat','Rasa malu, penyesalan'],
['Kesopanan','Kebiasaan sopan santun','Menyapa orang yang lebih tua','Teguran, dikucilkan'],
['Kebiasaan','Perilaku yang diulang dan diterima','Mengucap salam, kerja bakti','Sindiran, teguran'],
['Hukum','Peraturan negara','Mematuhi rambu lalu lintas','Denda, pidana']])}`,
quick:{title:'Tantangan kilat: jenis norma apa?',items:[
{q:'Berdoa sebelum belajar dan menjalankan ibadah.',o:['Agama','Kesopanan','Hukum','Kebiasaan'],a:0,why:'Bersumber dari ajaran agama.'},
{q:'Bertutur kata santun dan menyapa guru saat bertemu.',o:['Kesusilaan','Kesopanan','Hukum','Agama'],a:1,why:'Menyangkut sopan santun pergaulan.'},
{q:'Mematuhi rambu lalu lintas dan membayar pajak.',o:['Hukum','Kebiasaan','Kesopanan','Kesusilaan'],a:0,why:'Diatur peraturan negara dan ada sanksi resmi.'},
{q:'Tidak berbohong walaupun tidak ada yang mengawasi.',o:['Kesusilaan','Hukum','Kebiasaan','Kesopanan'],a:0,why:'Bersumber dari hati nurani.'}]}},

{title:'Norma dalam keluarga, sekolah, dan masyarakat',icon:'users',wide:true,
html:`${CO([['Keluarga',['Meminta izin sebelum pergi','Menghormati orang tua dan yang lebih tua','Makan bersama dan berbagi tugas rumah'],],['Sekolah',['Mematuhi tata tertib dan seragam','Tidak menyontek dan tidak merundung','Tidak berbicara saat guru menjelaskan']],['Masyarakat',['Kerja bakti dan ronda','Antre dan menjaga fasilitas umum','Menjaga kebersihan lingkungan']]])}
<p>Setiap lingkungan memiliki <b>sanksi</b> yang berbeda. Di keluarga berupa nasihat atau teguran, di sekolah berupa pembinaan, dan di masyarakat berupa teguran warga atau sanksi hukum jika melanggar hukum.</p>
<p>Sekolah juga membangun lingkungan aman. Permendikbudristek Nomor 46 Tahun 2023 mengatur pencegahan dan penanganan kekerasan di satuan pendidikan, dan sekolah memiliki tim khusus untuk itu.</p>
${TIP('Kasus di kelas: beberapa siswa berbicara saat guru menjelaskan. Tindakan tepat adalah menegur dengan sopan dan mengingatkan aturan kelas, bukan membiarkan, mengeluarkan tanpa proses, atau membalas dengan mengganggu.')}`,
terms:[['Tata tertib','Aturan tertulis yang harus dipatuhi di sekolah.'],['Perundungan','Perilaku menyakiti secara berulang, baik fisik maupun verbal.']]},

{title:'Kejujuran, tanggung jawab, toleransi, dan musyawarah',icon:'scale',vis:()=>ART.village(),cap:'Musyawarah: setiap orang didengar, keputusan diambil bersama.',
html:`<h4>Kejujuran dan tanggung jawab</h4><p>Jujur berarti sesuai kenyataan; bertanggung jawab berarti menyelesaikan kewajiban dan menerima akibatnya. Menemukan dompet lalu menyerahkannya kepada guru adalah contoh keduanya.</p>
<h4>Toleransi</h4><p>Menghargai perbedaan suku, agama, budaya, dan pendapat. Di Sulawesi Utara dikenal semboyan <i>Torang samua basudara</i> (kita semua bersaudara), sejalan dengan Bhinneka Tunggal Ika.</p>
<h4>Musyawarah</h4><ol><li>Menyampaikan pendapat dengan sopan.</li><li>Mendengarkan pendapat orang lain.</li><li>Mencari titik temu dan alasan terbaik.</li><li>Menyepakati keputusan bersama.</li><li>Melaksanakan dan menghormati hasilnya.</li></ol>
<p>Menghargai perbedaan pendapat bukan berarti menerima semuanya tanpa menimbang. Pendapat tetap dinilai dari alasan dan dampaknya.</p>`,
fact:'Masyarakat Minahasa mengenal Mapalus, tradisi kerja sama saling membantu. Nilai gotong royong hidup di banyak daerah.',
terms:[['Toleransi','Menghargai perbedaan.'],['Musyawarah','Pembahasan bersama untuk mencapai kesepakatan.'],['Mufakat','Kesepakatan bersama dari hasil musyawarah.']],
quick:{title:'Tantangan kilat: tindakan yang tepat',items:[
{q:'Kamu menemukan uang di kelas dan tidak ada yang melihat.',o:['Menyimpannya','Menyerahkannya kepada guru','Membaginya ke teman'],a:1,why:'Menyerahkan kepada guru mencerminkan kejujuran dan tanggung jawab.'},
{q:'Dua kelompok berbeda pendapat soal acara kelas. Sikap ketua kelas?',o:['Memutuskan sendiri','Memberi kesempatan tiap kelompok menyampaikan alasan','Membatalkan acara'],a:1,why:'Itulah musyawarah: mendengar semua pihak lalu mencari kesepakatan.'},
{q:'Teman berbeda suku dan agama mengajak kerja kelompok.',o:['Menolak karena berbeda','Bekerja sama dan saling menghargai','Hanya bekerja dengan yang sama'],a:1,why:'Toleransi berarti menghargai perbedaan dan tetap bekerja sama.'}]}},

{title:'Penerapan norma untuk menjaga lingkungan dan kehidupan bersama',icon:'leaf',wide:true,
html:`<p>Norma juga menjaga lingkungan, misalnya larangan membuang sampah ke sungai. Karena dampak tindakan dirasakan bersama, aturan ini penting walaupun tidak semua orang langsung terdampak.</p>
<h4>Kearifan lokal menjaga alam</h4><ul><li><b>Sasi</b> di Maluku dan Papua: larangan mengambil hasil alam tertentu selama waktu tertentu agar pulih.</li><li><b>Awig-awig</b> di Bali dan Lombok: aturan adat yang disepakati warga.</li><li><b>Kerja bakti dan Mapalus</b>: gotong royong menjaga lingkungan.</li></ul>
<h4>Menegakkan norma secara adil</h4>${FL([['Edukasi','Menjelaskan alasan aturan'],['Fasilitas','Tempat sampah, saluran, jadwal'],['Aturan','Disepakati bersama'],['Sanksi adil','Tanpa main hakim sendiri']])}
<p>Menyebarkan identitas pelanggar tanpa klarifikasi bukan cara yang tepat, karena dapat menimbulkan masalah baru.</p>`,
quick:{title:'Tantangan kilat: kasus lingkungan',items:[
{q:'Warga membuang sampah sembarangan karena merasa petugas akan membersihkan. Langkah terbaik?',o:['Membiarkan','Edukasi, sediakan fasilitas, tegakkan aturan secara adil','Menyebarkan identitas pelanggar'],a:1,why:'Norma diperkuat dengan pemahaman, dukungan sarana, dan penegakan yang adil.'},
{q:'Kenapa sasi melarang mengambil teripang selama beberapa bulan?',o:['Agar hasil laut pulih dan bisa dinikmati lama','Agar nelayan berhenti bekerja','Agar harga naik'],a:0,why:'Sasi memberi waktu alam pulih sehingga sumber daya terjaga.'},
{q:'Ada warga sering absen kerja bakti. Tindakan tepat?',o:['Menegur sopan dan mengajak bermusyawarah','Menghukum keras','Membiarkan saja'],a:0,why:'Pendekatan damai dan kesepakatan menjaga hubungan sekaligus norma.'}]}},

{title:'Video dan bacaan lanjutan',icon:'play',videos:true,links:[]},

{title:'Rangkuman misi 3',icon:'check',wide:true,
html:`<ul><li><b>Nilai sosial</b> adalah sesuatu yang dianggap baik dan berharga; <b>norma sosial</b> adalah pedoman perilaku.</li><li>Ada norma agama, kesusilaan, kesopanan, kebiasaan, dan hukum.</li><li>Norma berlaku di keluarga, sekolah, dan masyarakat.</li><li>Kejujuran, tanggung jawab, toleransi, dan musyawarah menjaga keteraturan.</li><li>Norma lingkungan perlu ditegakkan secara adil karena dampaknya dirasakan bersama.</li></ul>${TIP('Siap? Latih kartu istilah, lalu selesaikan asesmen 20 soal (minimal 85%).')}`}
],

[
{title:'Pengantar: cerita di balik nama tempat',icon:'pin',vis:()=>ART.oldmap(),cap:'Nama tempat pada peta lama sering menyimpan jejak sejarah.',
html:`<p><b>Toponimi</b> berasal dari bahasa Yunani: <i>topos</i> (tempat) dan <i>onoma</i> (nama). Toponimi adalah kajian tentang nama tempat: asal-usul, makna, dan sejarahnya.</p>
<p>Nama tempat jarang sembarangan. <b>Cipanas</b> berarti air panas, <b>Banyuwangi</b> berkaitan dengan air yang harum, dan <b>Ngawi</b> berkaitan dengan kata awi yang berarti bambu. Setiap nama menyimpan cerita tentang lingkungan, masyarakat, atau peristiwa.</p>
${TIP('Satu nama bisa punya lebih dari satu cerita. Karena itu peneliti tidak berhenti pada satu versi, tetapi memeriksanya.')}`,
fact:'BRIN menyebut toponimi sebagai identitas dan warisan budaya. Nama tempat yang tidak dicatat bisa hilang seiring waktu.',
terms:[['Toponimi','Kajian tentang nama tempat.'],['Etimologi','Asal-usul dan perkembangan makna kata.'],['Sumber lisan','Informasi dari wawancara atau cerita masyarakat.']],
quick:{title:'Tantangan kilat: nama ini berkaitan dengan apa?',items:[
{q:'Cipanas',o:['Kondisi alam (air panas)','Tokoh sejarah','Peristiwa perang'],a:0,why:'Ci berarti air; panas menunjukkan sumber air panas, jadi terkait kondisi alam.'},
{q:'Ngawi (dari kata awi, bambu)',o:['Tumbuhan yang banyak tumbuh','Perdagangan masa lalu','Nama tokoh'],a:0,why:'Wilayah ini dahulu banyak ditumbuhi bambu.'},
{q:'Kampung Melayu',o:['Kelompok masyarakat yang bermukim','Bentuk gunung','Nama sungai'],a:0,why:'Nama itu menunjuk kelompok masyarakat yang pernah tinggal di sana.'}]}},

/* ============ SUARA: semua disintesis, tanpa berkas audio ============ */
const Snd={ctx:null,master:null,sfx:true,music:true,mGain:null,timer:null,step:0,next:0,
init(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.ctx=new AC()}catch(e){return}
  this.master=this.ctx.createGain();this.master.gain.value=.85;this.master.connect(this.ctx.destination);
  this.mGain=this.ctx.createGain();this.mGain.gain.value=(this.music?0.05:0);this.mGain.connect(this.master);
  this.startMusic();
},
tone(f,d,type='sine',v=.2,when=0,slide=null,dest=null){
  if(!this.ctx)return;const c=this.ctx,t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+d+.03)},
noise(d,v=.15,f0=800,f1=4000,when=0){
  if(!this.ctx)return;const c=this.ctx,t=c.currentTime+when;const n=Math.floor(c.sampleRate*d);
  const b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(this.master);s.start(t)},
play(n,x=0){
  if(!this.sfx)return;this.init();if(!this.ctx)return;const T=this.tone.bind(this);
  switch(n){
  case 'click':T(620,.07,'square',.06);T(880,.06,'square',.04,.03);break;
  case 'select':T(520,.06,'triangle',.12);break;
  case 'hover':T(900,.03,'sine',.03);break;
  case 'type':T(1200+Math.random()*300,.02,'square',.012);break;
  case 'page':this.noise(.22,.09,500,3200);break;
  case 'back':this.noise(.2,.08,3000,500);break;
  case 'ok':T(660,.11,'triangle',.22);T(880,.11,'triangle',.22,.09);T(1320,.22,'triangle',.22,.18);break;
  case 'part':T(520,.12,'triangle',.2);T(700,.2,'triangle',.2,.1);break;
  case 'no':T(220,.32,'sawtooth',.16,0,110);T(160,.36,'square',.08,.05,80);break;
  case 'combo':{const b=[523,587,659,784,880,1046,1175][Math.min(x,6)];T(b,.1,'square',.09);T(b*1.5,.16,'triangle',.14,.08);break}
  case 'lock':T(300,.08,'square',.08);T(240,.1,'square',.08,.07);break;
  case 'match':T(784,.1,'triangle',.2);T(1046,.18,'triangle',.2,.09);break;
  case 'star':T(880+x*220,.28,'sine',.22);T((880+x*220)*2,.28,'sine',.08);break;
  case 'xp':T(1200,.06,'sine',.1);T(1600,.09,'sine',.1,.05);break;
  case 'unlock':[523,659,784,1046,1318].forEach((f,i)=>T(f,.18,'triangle',.16,i*.07));this.noise(.5,.06,1200,6000);break;
  case 'level':[523,659,784,1046,784,1046,1318].forEach((f,i)=>{T(f,.22,'square',.09,i*.1);T(f/2,.22,'triangle',.12,i*.1)});break;
  case 'win':[523,659,784,1046].forEach((f,i)=>{T(f,.3,'square',.1,i*.13);T(f*1.5,.3,'triangle',.1,i*.13)});T(1318,.7,'triangle',.18,.6);T(1046,.7,'triangle',.14,.6);break;
  case 'lose':[392,349,330,262].forEach((f,i)=>T(f,.34,'triangle',.18,i*.22,f*.94));break;
  case 'badge':T(988,.12,'square',.09);T(1318,.5,'triangle',.2,.1);T(1976,.5,'sine',.08,.1);break;
  case 'power':T(200,.4,'sawtooth',.08,0,900);break;
  }
},
/* musik latar: arpeggio pentatonik lembut */
startMusic(){
  if(!this.ctx||this.timer)return;this.next=this.ctx.currentTime+.1;this.step=0;
  const ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const tick=()=>{
    if(!this.ctx)return;
    while(this.next<this.ctx.currentTime+.6){
      const bar=Math.floor(this.step/8)%4,i=this.step%8,cd=ch[bar];
      const note=cd[[0,1,2,1,2,1,0,1][i]]+ (i===4?12:0);
      this.mnote(mf(note+12),this.next,.32,'triangle',.5);
      if(i===0){cd.forEach(n=>this.mnote(mf(n-12),this.next,1.6,'sine',.5))}
      if(i%4===2)this.mnote(mf(cd[2]+24),this.next,.2,'sine',.18);
      this.next+=.34;this.step++}
  };
  tick();this.timer=setInterval(tick,180);
},
mnote(f,t,d,type,v){
  const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(this.mGain);o.start(t);o.stop(t+d+.05)},
setSfx(on){this.sfx=on},
setMusic(on){this.music=on;if(this.ctx&&this.mGain){this.mGain.gain.cancelScheduledValues(this.ctx.currentTime);this.mGain.gain.linearRampToValueAtTime(on?0.05:0,this.ctx.currentTime+.4)}else if(on)this.init()},
};

const RANKS=['Agen baru','Penjelajah','Pengamat','Analis','Strategis','Ahli Nusantara','Pemimpin misi','Legenda Nusantara'];

/* ================= UTILITAS ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const dkey=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>' '+String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' ';

/* ================= PENYIMPANAN ================= */
let memStore=null,S={v:2,players:{},cur:null,sfx:true,music:true};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return k===STORE?memStore:null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){if(k===STORE)memStore=v}}
function save(){lsSet(STORE,JSON.stringify(S))}
function newPlayer(name,kelas,av){return{id:pid(name,kelas),name,kelas,av,created:Date.now(),xp:0,streak:{n:0,last:''},days:{},
 mods:[0,1,2,3].map(()=>({intro:false,cards:[],learn:false,practice:false,best:null,tries:0,kilat:{}})),final:{best:null,tries:0},seen:{},badges:{},attempts:[],session:null,stat:{combo:0,videos:0},vids:{}}}
function pid(n,k){return n.trim().toLowerCase().replace(/\s+/g,' ')+'|'+k}
function load(){
  try{const r=lsGet(STORE);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
  if(!Object.keys(S.players).length){/* migrasi dari versi 1 */
    try{const o=JSON.parse(lsGet(OLD)||'null');
      if(o&&o.identity&&o.identity.name){const p=newPlayer(o.identity.name,o.identity.kelas||'-',0);
        (o.moduleScores||[]).forEach((sc,i)=>{if(sc!=null){p.mods[i].best=sc;p.mods[i].intro=p.mods[i].learn=p.mods[i].practice=true}});
        if(o.final)p.final={best:o.final.percent,tries:1};
        (o.attempts||[]).forEach(a=>p.attempts.push({ts:Date.parse(a.date)||Date.now(),type:a.type==='final'?'final':'module',mod:a.module?a.module-1:null,pct:a.percent,pts:0,max:0,dur:0,shorts:[]}));
        S.players[p.id]=p;S.cur=p.id}}catch(e){}}
  Snd.sfx=S.sfx!==false;Snd.music=S.music!==false;
}
const P=()=>S.players[S.cur];
function ensure(p){p.mods=p.mods||[];while(p.mods.length<4)p.mods.push({intro:false,cards:[],learn:false,practice:false,best:null,tries:0,kilat:{}});p.stat=p.stat||{combo:0,videos:0};p.vids=p.vids||{};p.seen=p.seen||{};p.badges=p.badges||{};p.days=p.days||{};p.streak=p.streak||{n:0,last:''};p.attempts=p.attempts||[];p.final=p.final||{best:null,tries:0}}

function buildItems(kind,mod,seed){const r=rng(seed);let mc,tf,mt,sa,pool;
  if(kind==='final'){mc=BANK.mc;tf=BANK.tf;mt=BANK.match.filter(m=>m.inFinal);sa=BANK.short}
  else{mc=BANK.mc.filter(q=>q.mod===mod);tf=BANK.tf.filter(q=>q.mod===mod);mt=BANK.match.filter(m=>m.mod===mod&&m.inModule);sa=BANK.short.filter(s=>s.mod===mod)}
  const items=[];shuf(mc,r).forEach(q=>items.push({t:'mc',q,perm:shuf([0,1,2,3],r)}));shuf(tf,r).forEach(q=>items.push({t:'tf',q}));
  shuf(mt,r).forEach(m=>{const bad=new Set();BANK.conflicts.forEach(([a,b])=>{if(m.term===a)bad.add(b);if(m.term===b)bad.add(a)});
    const same=shuf(BANK.match.filter(x=>x.id!==m.id&&x.mod===m.mod&&!bad.has(x.term)&&x.def!==m.def),r);
    const other=shuf(BANK.match.filter(x=>x.mod!==m.mod&&!bad.has(x.term)),r);
    const opts=shuf([m,...same.concat(other).slice(0,3)],r);items.push({t:'mt',q:m,opts})});
  shuf(sa,r).forEach(q=>items.push({t:'sa',q}));return items}
function evalShort(q,text){const tx=norm(text||''),words=tx.trim().split(' ').filter(Boolean).length,stem=norm(q.stem);

  const hit=(t,k)=>k.length<=3?t.includes(' '+k+' '):t.includes(' '+k);
  const usable=all.filter(k=>!hit(stem,k));const hits=words<3?[]:usable.filter(k=>hit(tx,k));
  const pts=hits.length>=2?2:hits.length===1?1:0;return{pts,hits,max:2}}
function evalItem(it,a){
  if(it.t==='mc')return{pts:a!==undefined&&a===it.q.answer?1:0,max:1};
  if(it.t==='tf')return{pts:typeof a==='boolean'&&a===it.q.answer?1:0,max:1};
  if(it.t==='mt')return{pts:a!==undefined&&a===it.q.id?1:0,max:1};
  return evalShort(it.q,a)}

  if(it.t==='sa'){const c=e.pts===2?'ok':e.pts===1?'mid':'no';return `<div class="fb ${c}"><h4>${e.pts===2?'Jawaban lengkap!':e.pts===1?'Sebagian benar':'Belum tepat'} (${e.pts}/2 poin)</h4>${e.hits.length?`<div class="kwchips">${e.hits.slice(0,8).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}<p><b>Contoh jawaban:</b> ${esc(it.q.model)}</p><p class="muted small">Penilaian otomatis memakai kata kunci. Jawabanmu tetap dapat ditinjau guru.</p></div>`}
  const ok=e.pts===1;let corr='';if(!ok){if(it.t==='mc')corr=it.q.options[it.q.answer];else if(it.t==='tf')corr=it.q.answer?'Benar':'Salah';else corr=it.q.def}
  return `<div class="fb ${ok?'ok':'no'}"><h4>${ok?['Tepat!','Mantap!','Benar sekali!','Kerja bagus!'][Q.s.idx%4]:'Belum tepat'}</h4>${ok?'':`<p><b>Jawaban benar:</b> ${esc(corr)}</p>`}<p>${esc(it.t==='mt'?'Istilah "'+it.q.term+'" berarti: '+it.q.def:it.q.why)}</p></div>`}
function answer(v){const s=Q.s,k=s.idx,it=Q.items[k];if(s.checked[k])return;
  let val=v;if(it.t==='mc')val=Number(v);else if(it.t==='tf')val=(v==='true'||v===true);
  s.answers[k]=val;
  if(Q.instant){checkNow(k)}else{Snd.play('select');save();renderQ()}}
function checkNow(k){const s=Q.s,it=Q.items[k];if(s.checked[k])return;s.checked[k]=true;const e=evalItem(it,s.answers[k]);
  const good=e.pts>=(it.t==='sa'?1:1);const full=e.pts===e.max;
  if(full||(it.t==='sa'&&e.pts>0)){s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo)}else s.combo=0;
  const p=P();let xp=0;if(e.pts>0){const seen=!!p.seen[it.q.id];xp=it.t==='sa'?(e.pts===2?(seen?4:15):(seen?1:6)):(seen?3:10);p.seen[it.q.id]=true;if(s.combo>=3)xp+=(Math.min(s.combo,8)-2)*2}
  if(e.pts===e.max)s.correct++;
  Snd.play(full?'ok':e.pts>0?'part':'no');if(s.combo>=2&&full)setTimeout(()=>Snd.play('combo',s.combo-2),320);
  if(s.combo>p.stat.combo)p.stat.combo=s.combo;
  s.xp+=xp;save();renderQ();if(xp>0)addXP(xp,$('#qbox .fb')||$('#qbox'),true)}
function finishQuiz(){const s=Q.s,p=P();const sc=scoreAll(Q.items,s.answers);const dur=Math.round((Date.now()-s.start)/1000);
  const shorts=Q.items.map((it,k)=>it.t==='sa'?{id:it.q.id,stem:it.q.stem,ans:s.answers[k]||'',pts:evalShort(it.q,s.answers[k]).pts}:null).filter(Boolean);
  const prevBest=Q.kind==='final'?p.final.best:p.mods[Q.mod].best;
  const nCorrect=Q.items.filter((it,k)=>{const e=evalItem(it,s.answers[k]);return e.pts===e.max}).length;
  const att={ts:Date.now(),type:Q.kind==='final'?'final':'module',mod:Q.kind==='final'?null:Q.mod,pct:sc.pct,pts:sc.pts,max:sc.max,dur,shorts,wrong:Q.items.length-nCorrect};
  p.attempts.push(att);
  const kkm=Q.kind==='final'?KKM_FINAL:KKM_MOD;const pass=sc.pct>=kkm;
  const wasPass=prevBest!==null&&prevBest>=kkm;
  if(Q.kind==='final'){p.final.tries++;if(prevBest===null||sc.pct>prevBest)p.final.best=sc.pct}else{p.mods[Q.mod].tries++;if(prevBest===null||sc.pct>prevBest)p.mods[Q.mod].best=sc.pct}
  sendToSheet({nama:p.name,kelas:p.kelas,jenis:Q.kind==='final'?'Tes Akhir':'Misi '+(Q.mod+1),misi:Q.kind==='final'?'':Q.mod+1,
    nilai:sc.pct,skor:sc.pts,skorMaks:sc.max,durasi:dur,
    m1:p.mods[0].best??'',m2:p.mods[1].best??'',m3:p.mods[2].best??'',m4:p.mods[3].best??'',finalNilai:p.final.best??'',
    level:lvl(p.xp),xp:p.xp,status:statusText(p),shorts:shorts.map(s=>({id:s.id,stem:s.stem,ans:s.ans,pts:s.pts}))});
  let bonus=0;if(!Q.instant){bonus+=nCorrect*2}if(pass&&!wasPass)bonus+=Q.kind==='final'?200:100;
  const gained=s.xp+bonus;const unlockedNew=pass&&!wasPass;
  const snap={kind:Q.kind,mod:Q.mod,items:Q.items,answers:s.answers,sc,pass,kkm,gained,unlockedNew,best:Q.kind==='final'?p.final.best:p.mods[Q.mod].best,instant:Q.instant,maxCombo:s.maxCombo,dur};
  p.session=null;save();Q=null;
  if(bonus)addXP(bonus,null,true);else{hud();checkBadges()}
  go('result',snap)}

  case 'exitq':modal(`<h3>Keluar dari asesmen?</h3><p>Kemajuanmu tersimpan dan dapat dilanjutkan nanti.</p><div class="row"><button class="btn danger" data-a="doexit">Keluar</button><button class="btn ghost" data-a="closem">Lanjut mengerjakan</button></div>`);break;
  case 'doexit':{closeModal();save();const m=Q.kind==='final'?null:Q.mod;Q=null;m===null?go('final'):go('mission',{i:m});break}
  case 'resume':beginQuiz(b.dataset.kind,b.dataset.kind==='final'?null:Number(v),true);break;
  case 'fresh':P().session=null;beginQuiz(b.dataset.kind,b.dataset.kind==='final'?null:Number(v),false);break;
  case 'startfinal':startQuiz('final',null);break;
  case 'review':showReview();break;
  case 'retry':if(b.dataset.kind==='final')startQuiz('final',null);else startQuiz('mod',Number(v));break;
  case 'pin':{const x=$('#pin').value;if(x===TEACHER_PIN){TOK=true;Snd.play('unlock');render()}else{$('#perr').classList.remove('hidden');Snd.play('no')}break}
  case 'tlock':TOK=false;Snd.play('click');render();break;
  case 'csv1':dl('rekap_mpi_bab2.csv',csv([['Nama','Kelas','Misi 1 (%)','Misi 2 (%)','Misi 3 (%)','Misi 4 (%)','Tes akhir (%)','Level','XP','Status'],...Object.values(S.players).map(p=>[p.name,p.kelas,...[0,1,2,3].map(i=>p.mods[i].best??''),p.final.best??'',lvl(p.xp),p.xp,finalOk(p)?'Lulus':allTuntas(p)?'Siap tes akhir':'Belum'])]));break;
  case 'csv2':dl('log_percobaan_mpi_bab2.csv',csv([['Nama','Kelas','Jenis','Misi','Nilai (%)','Skor','Skor maks','Durasi (detik)','Waktu'],...Object.values(S.players).flatMap(p=>p.attempts.map(a=>[p.name,p.kelas,a.type==='final'?'Tes akhir':'Asesmen misi',a.mod==null?'':a.mod+1,a.pct,a.pts,a.max,a.dur,new Date(a.ts).toISOString()]))]));break;
  case 'csv3':dl('jawaban_uraian_mpi_bab2.csv',csv([['Nama','Kelas','Jenis','Misi','Kode soal','Pertanyaan','Jawaban siswa','Skor (0-2)','Waktu'],...Object.values(S.players).flatMap(p=>p.attempts.flatMap(a=>(a.shorts||[]).map(s=>[p.name,p.kelas,a.type==='final'?'Tes akhir':'Asesmen misi',a.mod==null?'':a.mod+1,s.id,s.stem,s.ans,s.pts,new Date(a.ts).toISOString()])))]));break;
  case 'delp':modal(`<h3>Hapus data pemain?</h3><p>${esc(S.players[v]?S.players[v].name:'')} akan dihapus dari perangkat ini.</p><div class="row"><button class="btn danger" data-a="dodelp" data-v="${esc(v)}">Hapus</button><button class="btn ghost" data-a="closem">Batal</button></div>`);break;
  case 'dodelp':delete S.players[v];if(S.cur===v)S.cur=null;save();closeModal();render();break;
  case 'delall':modal(`<h3>Hapus semua data?</h3><p>Seluruh pemain dan nilai pada perangkat ini akan hilang. Unduh CSV terlebih dahulu.</p><div class="row"><button class="btn danger" data-a="dodelall">Hapus semua</button><button class="btn ghost" data-a="closem">Batal</button></div>`);break;
  case 'dodelall':S={v:2,players:{},cur:null,sfx:S.sfx,music:S.music};save();closeModal();go('welcome');break;
  }});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal .modal')){closeModal();return}
  if(V.name==='quiz'&&Q&&!e.target.closest('textarea,input')){const it=Q.items[Q.s.idx];
    if(e.key==='Enter'){const n=$('#nx')||($('[data-a=qnext]'));if(n&&(Q.instant?Q.s.checked[Q.s.idx]:true))n.click();return}
    const k='1234abcd'.indexOf(e.key.toLowerCase());
    if(k>=0&&!Q.s.checked[Q.s.idx]){const d=k%4;const btn=$$('.opt')[d];if(btn&&(it.t==='mc'||it.t==='mt'))btn.click()}}
  if(V.name==='welcome'&&e.key==='Enter'&&e.target.closest('input'))beginPlayer()});
document.addEventListener('pointerdown',()=>{Snd.init()},{once:true});

/* ================= MULAI ================= */
load();
if(S.cur&&S.players[S.cur]){ensure(P());V={name:'home',arg:{}}}
render();


</script></body></html>
